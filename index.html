<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Speed Dash Corkscrew</title>
  <style>
    :root {
      --ctrl-opacity: 0.72;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #02040d;
      overflow: hidden;
      touch-action: none;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    #fsBtn,
    #ctrlVisBtn {
      position: fixed;
      z-index: 45;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.13);
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.40);
      font-size: 24px;
      opacity: 0.58;
    }

    #fsBtn {
      top: calc(10px + env(safe-area-inset-top));
      right: calc(12px + env(safe-area-inset-right));
    }

    #ctrlVisBtn {
      top: calc(10px + env(safe-area-inset-top));
      left: calc(12px + env(safe-area-inset-left));
      display: none;
    }

    #fsBtn:active,
    #ctrlVisBtn:active {
      opacity: 0.95;
      background: rgba(255, 255, 255, 0.13);
    }

    @media (pointer: coarse) {
      #ctrlVisBtn {
        display: block;
      }
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(6px + env(safe-area-inset-bottom));
      display: none;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 30;
      pointer-events: none;
    }

    .group {
      display: flex;
      gap: clamp(8px, 1.5vw, 14px);
      pointer-events: auto;
    }

    .ctrl {
      width: clamp(58px, 12vw, 88px);
      height: clamp(58px, 12vw, 88px);
      border-radius: 20px;
      border: 2px solid rgba(255, 255, 255, 0.20);
      background: rgba(255, 255, 255, 0.10);
      color: rgba(255, 255, 255, 0.70);
      font-size: clamp(22px, 4.6vw, 30px);
      font-weight: bold;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      backdrop-filter: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.14);
      opacity: var(--ctrl-opacity);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.30);
      transition:
        transform 60ms ease,
        background 200ms ease,
        border-color 200ms ease;
    }

    .ctrl.smallText {
      font-size: clamp(13px, 2.4vw, 18px);
    }

    .ctrl.wide {
      width: clamp(110px, 22vw, 160px);
    }

    .ctrl:active {
      opacity: calc(var(--ctrl-opacity) + 0.22);
      background: rgba(255, 255, 255, 0.18);
      transform: scale(0.94);
      border-color: rgba(255, 255, 255, 0.35);
    }

    #controls.show {
      display: flex;
    }

    @media (pointer: coarse) {
      #controls {
        display: flex;
      }
    }

    #scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 21;
      opacity: 0.12;
      background: repeating-linear-gradient(
        0deg,
        rgba(255, 255, 255, 0.035) 0px,
        rgba(255, 255, 255, 0.035) 1px,
        transparent 2px,
        transparent 4px
      );
      mix-blend-mode: overlay;
    }

    @media (prefers-reduced-motion: reduce) {
      #scanlines {
        display: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="scanlines"></div>

  <button id="fsBtn" title="Fullscreen">⛶</button>
  <button id="ctrlVisBtn" title="Button-Sichtbarkeit">◐</button>

  <div id="controls">
    <div class="group">
      <button class="ctrl" data-key="ArrowLeft">◀</button>
      <button class="ctrl" data-key="ArrowRight">▶</button>
    </div>

    <div class="group">
      <button class="ctrl smallText wide" data-key="Space">JUMP</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const H = 540;
    let VIEW_W = 960;

    let cameraX = 0;
    let cameraY = 0;

    const isTouch =
      ("ontouchstart" in window) ||
      navigator.maxTouchPoints > 0 ||
      window.matchMedia("(pointer: coarse)").matches;

    const MOBILE_LIFT = isTouch ? 78 : 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const aspect = window.innerWidth / Math.max(1, window.innerHeight);

      VIEW_W = Math.round(H * aspect);
      VIEW_W = Math.max(320, Math.min(2400, VIEW_W));

      canvas.width = Math.round(VIEW_W * dpr);
      canvas.height = Math.round(H * dpr);

      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", resize);
    resize();

    if (isTouch) {
      document.getElementById("controls").classList.add("show");
    }

    const fsBtn = document.getElementById("fsBtn");
    const ctrlVisBtn = document.getElementById("ctrlVisBtn");

    function goFullscreen() {
      const el = document.documentElement;

      if (el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
      } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
      }
    }

    let fsAutoDone = false;

    function tryAutoFullscreen() {
      if (fsAutoDone) return;
      fsAutoDone = true;
      goFullscreen();
    }

    window.addEventListener("pointerdown", tryAutoFullscreen, { once: true });
    window.addEventListener("keydown", tryAutoFullscreen, { once: true });

    fsBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
    fsBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      goFullscreen();
    });

    const ctrlVisValues = [0.72, 0.42, 0.95];
    let ctrlVisIndex = 0;

    ctrlVisBtn.addEventListener("pointerdown", (e) => e.stopPropagation());
    ctrlVisBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      ctrlVisIndex = (ctrlVisIndex + 1) % ctrlVisValues.length;
      document.documentElement.style.setProperty(
        "--ctrl-opacity",
        ctrlVisValues[ctrlVisIndex]
      );
    });

    const STEP = 1 / 60;
    const LEVEL_COUNT = 4;

    const START_LIVES = 8;
    const START_RINGS = 5;
    const BOSS_HEALTH = 3;
    const ENEMY_SPEED = 1.0;

    const GRAVITY = 0.66;
    const JUMP_POWER = -16.3;
    const DOUBLE_JUMP_POWER = -14.6;

    const ACCEL = 1.05;
    const AIR_ACCEL = 0.62;
    const MAX_BASE = 15.2;

    const INVULN_TIME = 3.5;
    const BOSS_BULLET_SPEED = 3.4;
    const DOUBLE_JUMP = true;

    let gameState = "title";
    let currentLevel = 0;
    let score = 0;
    let rings = START_RINGS;
    let lives = START_LIVES;
    let time = 0;
    let levelMessage = 0;
    let animT = 0;
    let checkpoint = null;

    let shake = 0;
    let combo = 0;
    let comboTimer = 0;
    let flash = 0;
    let hitStop = 0;
    let boostMeter = 0;
    let flowHeat = 0;
    let flowMaxed = false;
    let pendingWin = 0;
    let ringStorm = 0;

    let gpLeft = false;
    let gpRight = false;
    let gpJumpHeld = false;

    let bossWarned = false;

    const particles = [];
    const popups = [];

    const keys = {};
    let jumpPressed = false;

    const player = {
      x: 80,
      y: 320,
      w: 26,
      h: 34,
      vx: 0,
      vy: 0,
      onGround: false,
      facing: 1,
      rolling: false,
      autoBoost: 0,
      invuln: 0,
      spinAngle: 0,
      jumping: false,
      doubleUsed: false,
      loop: null,
      rail: null,
      corkscrew: null,
      shield: false,
      squash: 0,
      trail: []
    };

    let level = null;

    const themes = [
      {
        skyTop: "#5ec8ff",
        skyMid: "#aeeaff",
        skyBottom: "#f2ffff",
        hill1: "#7fdb8f",
        hill2: "#4fc46a",
        ambient: "rgba(180,255,190,"
      },
      {
        skyTop: "#ff8f5e",
        skyMid: "#ffc792",
        skyBottom: "#fff0d0",
        hill1: "#d97b6c",
        hill2: "#a34d5e",
        ambient: "rgba(255,210,160,"
      },
      {
        skyTop: "#101128",
        skyMid: "#34194d",
        skyBottom: "#582364",
        hill1: "#3d1f56",
        hill2: "#2a103c",
        ambient: "rgba(200,170,255,"
      },
      {
        skyTop: "#0b0f3a",
        skyMid: "#1d1a63",
        skyBottom: "#5e2ca5",
        hill1: "#392b7a",
        hill2: "#1c1450",
        ambient: "rgba(0,255,255,"
      }
    ];

    const groundThemes = [
      { dirt: "#7b4a21", grass: "#49d651", light: "#a2ff9e" },
      { dirt: "#6d4c41", grass: "#ffb74d", light: "#ffe0b2" },
      { dirt: "#37474f", grass: "#b0bec5", light: "#eceff1" },
      { dirt: "#141034", grass: "#00e5ff", light: "#b2fff9" }
    ];

    let audioCtx = null;
    let masterGain = null;
    let musicGain = null;
    let sfxGain = null;
    let delayNode = null;
    let musicFilter = null;
    let musicTimer = null;
    let musicStep = 0;
    let muted = false;
    let noiseBuffer = null;

    const musicPatterns = [
      {
        bpm: 156,
        bass: [36, 36, 43, 36, 41, 36, 43, 45],
        lead: [72, 76, 79, 76, 74, 76, 79, 81, 79, 76, 74, 76, 72, 74, 76, 79],
        chords: [
          [60, 64, 67],
          [57, 60, 64],
          [55, 59, 62],
          [57, 60, 64]
        ]
      },
      {
        bpm: 140,
        bass: [33, 33, 40, 33, 38, 33, 40, 41],
        lead: [69, 72, 76, 72, 74, 72, 76, 77, 76, 74, 72, 74, 69, 71, 72, 76],
        chords: [
          [57, 60, 64],
          [55, 59, 62],
          [53, 57, 60],
          [55, 59, 62]
        ]
      },
      {
        bpm: 168,
        bass: [28, 28, 35, 28, 33, 28, 35, 36],
        lead: [64, 67, 71, 67, 65, 67, 71, 72, 71, 67, 65, 67, 64, 65, 67, 71],
        chords: [
          [52, 55, 59],
          [50, 53, 57],
          [48, 52, 55],
          [50, 53, 57]
        ]
      }
    ];

    function initAudio() {
      if (audioCtx) {
        if (audioCtx.state === "suspended") audioCtx.resume();
        return;
      }

      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;

      audioCtx = new AC();

      masterGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : 0.5;

      const compressor = audioCtx.createDynamicsCompressor();
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      musicGain = audioCtx.createGain();
      musicGain.gain.value = 0.18;

      sfxGain = audioCtx.createGain();
      sfxGain.gain.value = 0.35;
      sfxGain.connect(masterGain);

      delayNode = audioCtx.createDelay(1.0);
      delayNode.delayTime.value = 0.16;

      const feedback = audioCtx.createGain();
      feedback.gain.value = 0.24;

      delayNode.connect(feedback);
      feedback.connect(delayNode);
      delayNode.connect(masterGain);

      musicFilter = audioCtx.createBiquadFilter();
      musicFilter.type = "lowpass";
      musicFilter.frequency.value = 6500;

      musicGain.connect(musicFilter);
      musicFilter.connect(masterGain);
      musicFilter.connect(delayNode);
    }

    function toggleMute() {
      muted = !muted;
      if (masterGain) masterGain.gain.value = muted ? 0 : 0.5;
    }

    function midiToFreq(m) {
      return 440 * Math.pow(2, (m - 69) / 12);
    }

    function getNoiseBuffer() {
      if (!audioCtx) return null;
      if (noiseBuffer) return noiseBuffer;

      const len = audioCtx.sampleRate * 0.2;
      noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);

      for (let i = 0; i < len; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      return noiseBuffer;
    }

    function playSynth(midi, dur = 0.1, type = "square", gain = 0.2, slide = 0, when = 0, dest = null) {
      if (!audioCtx || muted) return;

      const t = audioCtx.currentTime + when;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();

      o.type = type;
      o.frequency.setValueAtTime(midiToFreq(midi), t);

      if (slide !== 0) {
        o.frequency.exponentialRampToValueAtTime(
          Math.max(20, midiToFreq(midi + slide)),
          t + dur
        );
      }

      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);

      o.connect(g);
      g.connect(dest || sfxGain);

      o.start(t);
      o.stop(t + dur + 0.03);
    }

    function playMusicNote(midi, dur, type, gain) {
      playSynth(midi, dur, type, gain, 0, 0, musicGain);
    }

    function playNoise(dur = 0.05, gain = 0.1, filterType = "highpass", when = 0, dest = null) {
      if (!audioCtx || muted) return;

      const buffer = getNoiseBuffer();
      if (!buffer) return;

      const src = audioCtx.createBufferSource();
      src.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = filterType;
      filter.frequency.value = filterType === "bandpass" ? 1800 : 6500;

      const g = audioCtx.createGain();
      const t = audioCtx.currentTime + when;

      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);

      src.connect(filter);
      filter.connect(g);
      g.connect(dest || musicGain);

      src.start(t);
      src.stop(t + dur + 0.02);
    }

    function playKick(when = 0, dest = null) {
      if (!audioCtx || muted) return;

      const t = audioCtx.currentTime + when;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();

      o.type = "sine";
      o.frequency.setValueAtTime(135, t);
      o.frequency.exponentialRampToValueAtTime(34, t + 0.12);

      g.gain.setValueAtTime(0.52, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);

      o.connect(g);
      g.connect(dest || musicGain);

      o.start(t);
      o.stop(t + 0.17);
    }

    function startMusic(levelIndex) {
      if (!audioCtx) return;

      stopMusic();

      const p = musicPatterns[levelIndex] || musicPatterns[0];
      musicStep = 0;

      const stepDur = 60 / p.bpm / 2;
      const ms = stepDur * 1000;

      musicTimer = setInterval(() => {
        if (muted || gameState !== "play") return;

        const idx = musicStep % 16;
        const bar = Math.floor(musicStep / 16);
        const chord = p.chords[bar % p.chords.length];

        if (idx % 4 === 0) {
          playKick(0, musicGain);

          if (audioCtx && musicGain) {
            musicGain.gain.setTargetAtTime(0.15, audioCtx.currentTime, 0.01);
            musicGain.gain.setTargetAtTime(
              0.18 + flowHeat * 0.05,
              audioCtx.currentTime + 0.12,
              0.1
            );
          }
        }

        if (idx % 2 === 0) {
          playMusicNote(
            p.bass[Math.floor(idx / 2) % p.bass.length],
            stepDur * 0.9,
            "triangle",
            0.24
          );
        } else {
          playMusicNote(
            p.bass[Math.floor((idx - 1) / 2) % p.bass.length] + 12,
            stepDur * 0.32,
            "triangle",
            0.05
          );
        }

        if (idx === 0 || idx === 8) {
          playMusicNote(
            p.bass[Math.floor(idx / 2) % p.bass.length] - 12,
            stepDur * 1.4,
            "sine",
            0.12
          );
        }

        playMusicNote(
          p.lead[idx % p.lead.length],
          stepDur * 0.7,
          "square",
          0.06
        );

        if (idx % 4 === 0) {
          playMusicNote(
            p.lead[idx % p.lead.length] - 12,
            stepDur * 1.2,
            "triangle",
            0.03
          );
        }

        if (idx === 0 || idx === 8) {
          for (const n of chord) {
            playMusicNote(n, stepDur * 3.6, "triangle", 0.045);
          }
        }

        if (idx === 4 || idx === 12) {
          for (const n of chord) {
            playMusicNote(n + 12, stepDur * 0.4, "sine", 0.03);
          }
        }

        const arpNote = chord[(musicStep + idx) % chord.length] + 12;
        playMusicNote(arpNote, stepDur * 0.22, "square", 0.022);

        if (idx === 4 || idx === 12) {
          playNoise(0.09, 0.06, "bandpass", 0, musicGain);
        }

        if (idx % 2 === 0) {
          playNoise(0.03, 0.025, "highpass", 0, musicGain);
        } else {
          playNoise(0.02, 0.012, "highpass", 0, musicGain);
        }

        if (idx === 2 || idx === 10) {
          playNoise(0.05, 0.02, "highpass", 0, musicGain);
        }

        if (idx === 6 || idx === 14) {
          playNoise(0.07, 0.03, "highpass", 0, musicGain);
        }

        if (idx === 0 && bar % 2 === 0) {
          playMusicNote(p.lead[0] + 24, stepDur * 2.2, "sine", 0.03);
        }

        if (musicStep % 64 === 0) {
          playSynth(48, stepDur * 8, "sawtooth", 0.015, 18, 0, musicGain);
        }

        musicStep++;
      }, ms);
    }

    function stopMusic() {
      if (musicTimer) {
        clearInterval(musicTimer);
        musicTimer = null;
      }
    }

    function sfxJump() {
      playSynth(72, 0.13, "square", 0.18, 12);
    }

    function sfxDoubleJump() {
      playSynth(78, 0.12, "square", 0.16, 16);
    }

    function sfxRing() {
      playSynth(91, 0.06, "sine", 0.16);
      playSynth(98, 0.08, "sine", 0.14, 0, 0.05);
    }

    function sfxBoost() {
      playSynth(55, 0.18, "sawtooth", 0.2, 28);
    }

    function sfxAutoBoost() {
      playSynth(48, 0.22, "sawtooth", 0.22, 24);
      playSynth(72, 0.12, "square", 0.12, 10, 0.03);
    }

    function sfxFlowMax() {
      playSynth(76, 0.14, "square", 0.16, 8);
      playSynth(83, 0.16, "square", 0.14, 6, 0.06);
    }

    function sfxRingStorm() {
      playSynth(88, 0.12, "sine", 0.16, 6);
      playSynth(95, 0.16, "sine", 0.14, 4, 0.06);
    }

    function sfxHurt() {
      playSynth(50, 0.25, "sawtooth", 0.24, -20);
    }

    function sfxSpring() {
      playSynth(65, 0.16, "square", 0.18, 20);
    }

    function sfxEnemy() {
      playSynth(70, 0.08, "square", 0.15, -10);
    }

    function sfxBossHit() {
      playSynth(38, 0.2, "square", 0.28, -12);
      playSynth(62, 0.12, "sawtooth", 0.16, 12, 0.03);
    }

    function sfxShoot() {
      playSynth(76, 0.08, "square", 0.1, -10);
    }

    function sfxCheckpoint() {
      [72, 79, 84].forEach((n, i) => {
        playSynth(n, 0.12, "square", 0.14, 0, i * 0.06);
      });
    }

    function sfxHeart() {
      [76, 83, 88].forEach((n, i) => {
        playSynth(n, 0.12, "sine", 0.16, 0, i * 0.06);
      });
    }

    function sfxShield() {
      [74, 86, 93].forEach((n, i) => {
        playSynth(n, 0.12, "sine", 0.18, 0, i * 0.06);
      });
    }

    function sfxLevelClear() {
      [72, 76, 79, 84].forEach((n, i) => {
        playSynth(n, 0.16, "square", 0.16, 0, i * 0.09);
      });
    }

    function sfxWin() {
      [60, 64, 67, 72, 76, 79, 84].forEach((n, i) => {
        playSynth(n, 0.18, "square", 0.16, 0, i * 0.08);
      });
    }

    function sfxCorkscrew() {
      playSynth(60, 0.16, "sawtooth", 0.18, 22);
      playSynth(84, 0.12, "square", 0.12, 10, 0.05);
    }

    function addRings(arr, x, y, n = 1, dx = 38) {
      for (let i = 0; i < n; i++) {
        arr.push({ x: x + i * dx, y, taken: false });
      }
    }

    function createBoss() {
      return {
        x: 1400,
        y: 300,
        w: 96,
        h: 96,
        baseY: 300,
        health: BOSS_HEALTH,
        maxHealth: BOSS_HEALTH,
        state: "hover",
        timer: 1.4,
        invuln: 0,
        dir: -1,
        phase: 0,
        vulnerable: false,
        hitFlash: 0,
        shootTimer: 2.8,
        phase2: false
      };
    }

    function shiftLevelForMobile(lvl, dy) {
      lvl.playerStart.y += dy;

      if (lvl.minY !== undefined) lvl.minY += dy;
      if (lvl.bottom !== undefined) lvl.bottom += dy;

      if (lvl.platforms) lvl.platforms.forEach((p) => (p.y += dy));
      if (lvl.spikes) lvl.spikes.forEach((s) => (s.y += dy));
      if (lvl.springs) lvl.springs.forEach((s) => (s.y += dy));
      if (lvl.boosters) lvl.boosters.forEach((b) => (b.y += dy));
      if (lvl.rails) lvl.rails.forEach((r) => (r.y += dy));
      if (lvl.loops) lvl.loops.forEach((l) => (l.cy += dy));
      if (lvl.rings) lvl.rings.forEach((r) => (r.y += dy));
      if (lvl.enemies) lvl.enemies.forEach((e) => (e.y += dy));
      if (lvl.checkpoints) lvl.checkpoints.forEach((c) => (c.y += dy));
      if (lvl.hearts) lvl.hearts.forEach((h) => (h.y += dy));
      if (lvl.shields) lvl.shields.forEach((s) => (s.y += dy));
      if (lvl.goal) lvl.goal.y += dy;

      if (lvl.corkscrews) {
        lvl.corkscrews.forEach((c) => {
          c.y += dy;
        });
      }

      if (lvl.boss) {
        lvl.boss.y += dy;
        lvl.boss.baseY += dy;
      }

    function clampCameraY(target) {
      if (!level) return 0;

      const minCamY = level.minY !== undefined ? level.minY : 0;
      const maxCamY = (level.bottom !== undefined ? level.bottom : H) - H;

      if (maxCamY <= minCamY) return 0;

      return Math.max(minCamY, Math.min(maxCamY, target));

    function handleMenuButton() {

        gameState = "levelIntro";

      } else if (gameState === "dead") {
        loadLevel(currentLevel);
        gameState = "levelIntro";
      } else if (gameState === "levelClear") {
        checkpoint = null;
        const next = currentLevel + 1;

        if (next >= LEVEL_COUNT) {
          gameState = "win";
          sfxWin();
        } else {
          loadLevel(next);
          gameState = "levelIntro";
        }
      } else if (gameState === "gameover" || gameState === "win") {
        checkpoint = null;
        gameState = "title";
        stopMusic();
      }

      jumpPressed = false;
    }

    function pressControl(code) {
      initAudio();

      if (["Space", "ArrowUp", "KeyW"].includes(code)) {
        jumpPressed = true;
      }

      keys[code] = true;

      if (gameState !== "play" && ["Space", "Enter"].includes(code)) {
        handleMenuButton();
      }
    }

    function releaseControl(code) {
      keys[code] = false;

      if (gameState === "play" && code === "Space" && player.vy < -9) {
        player.vy = -9;
      }
    }

    window.addEventListener("keydown", (e) => {
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
        e.preventDefault();
      }

      if (e.code === "KeyM") {
        toggleMute();
      }

      if (!keys[e.code]) {
        pressControl(e.code);
      }

      keys[e.code] = true;
    });

    window.addEventListener("keyup", (e) => {
      releaseControl(e.code);
    });

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();

    });

    document.querySelectorAll(".ctrl").forEach((btn) => {
      const code = btn.dataset.key;

      btn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        e.stopPropagation();

        try {
          btn.setPointerCapture(e.pointerId);
        } catch (err) {}

        pressControl(code);
        btn.classList.add("active");
      });

      const release = (e) => {
        e.preventDefault();
        e.stopPropagation();
        releaseControl(code);
        btn.classList.remove("active");
      };

      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointercancel", release);
      btn.addEventListener("contextmenu", (e) => e.preventDefault());
    });

    function pollGamepad() {
      gpLeft = false;
      gpRight = false;

      if (!navigator.getGamepads) return;

      const pads = navigator.getGamepads();

      for (let i = 0; i < pads.length; i++) {
        const gp = pads[i];
        if (!gp) continue;

        const ax = gp.axes[0] || 0;

        if (gp.buttons[14] && gp.buttons[14].pressed) gpLeft = true;
        if (gp.buttons[15] && gp.buttons[15].pressed) gpRight = true;

        if (ax < -0.35) gpLeft = true;
        if (ax > 0.35) gpRight = true;

        const jump = gp.buttons[0] && gp.buttons[0].pressed;

        if (jump && !gpJumpHeld) {
          jumpPressed = true;
        }

        gpJumpHeld = jump;

        break;
      }
    }

    function intersects(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function spawnParticles(x, y, color, n = 8, speed = 3) {
      for (let i = 0; i < n; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * speed * 2,
          vy: (Math.random() - 0.7) * speed * 2,
          life: 0.35 + Math.random() * 0.35,
          color,
          size: 2 + Math.random() * 3

    function updatePopups() {
      for (let i = popups.length - 1; i >= 0; i--) {
        const p = popups[i];

        p.life -= STEP;
        p.y -= 0.6;

        if (p.life <= 0) {
          popups.splice(i, 1);
        }
      }
    }

    function roundRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function mod(a, n) {
      return ((a % n) + n) % n;
    }

    function getRank() {
      if (score >= 35000) return "S";
      if (score >= 24000) return "A";
      if (score >= 14000) return "B";

    function hurtPlayer() {
      if (player.invuln > 0) return;

      flowHeat = Math.max(0, flowHeat - 0.45);

      if (player.shield) {
        player.shield = false;
        player.invuln = 2.0;
        sfxHurt();
        shake = Math.max(shake, 0.25);
        flash = Math.max(flash, 0.12);
        spawnParticles(player.x + player.w / 2, player.y + player.h / 2, "#4fc3f7", 20, 5);
        return;
      }

      if (rings > 0) {
        rings = 0;
        player.invuln = INVULN_TIME;
        player.vy = -9;
        player.vx = -player.facing * 7;
        sfxHurt();
        shake = Math.max(shake, 0.22);
        flash = Math.max(flash, 0.10);
        spawnParticles(player.x + player.w / 2, player.y + player.h / 2, "#ffd54f", 18, 5);
      } else {
        killPlayer();
      }
    }

    function killPlayer() {
      if (gameState !== "play") return;

      lives--;
      stopMusic();
      sfxHurt();

      shake = Math.max(shake, 0.42);
      flash = Math.max(flash, 0.22);
      hitStop = Math.max(hitStop, 0.10);

      flowHeat = 0;
      flowMaxed = false;

      player.spiral = null;
      player.loop = null;
      player.rail = null;
      player.corkscrew = null;

      spawnParticles(player.x + player.w / 2, player.y + player.h / 2, "#ff5252", 26, 7);

      if (lives <= 0) {
        gameState = "gameover";
      } else {
        gameState = "dead";
      }
    }

    function updateNormal() {
      const left = keys.ArrowLeft || keys.KeyA || gpLeft;
      const right = keys.ArrowRight || keys.KeyD || gpRight;

      if (player.onGround && Math.abs(player.vx) > 10.0) {
        player.rolling = true;
      }

      if (player.rolling && (!player.onGround || Math.abs(player.vx) < 7.0)) {
        player.rolling = false;
      }

      const boostActive = player.autoBoost > 0;
      const flowMult = 1 + flowHeat * 0.42;

      const maxSpeed =
        boostActive ? (25 + flowHeat * 7) :
        player.rolling ? (19 * flowMult) :
        (MAX_BASE * flowMult);

      if (left && !right) {
        player.vx -= player.onGround ? (boostActive ? 1.22 : ACCEL) : AIR_ACCEL;
        player.facing = -1;
      }

      if (right && !left) {
        player.vx += player.onGround ? (boostActive ? 1.22 : ACCEL) : AIR_ACCEL;
        player.facing = 1;
      }

      if ((!left && !right) || (left && right)) {
        const friction =
          player.onGround ?
            (boostActive || player.rolling || flowHeat > 0.7 ? 0.999 : 0.976) :
            0.995;

        player.vx *= friction;

        if (Math.abs(player.vx) < 0.12) {
          player.vx = 0;
        }
      }

      if (Math.abs(player.vx) > maxSpeed) {
        player.vx = Math.sign(player.vx) * maxSpeed;
      }

      if (jumpPressed && player.onGround) {
        player.vy = JUMP_POWER;
        player.onGround = false;
        player.jumping = true;
        player.rolling = false;
        player.doubleUsed = false;
        player.squash = 0;

        if (Math.abs(player.vx) > 12) {
          player.vx *= 1.03;
        }

        sfxJump();
      } else if (DOUBLE_JUMP && jumpPressed && !player.onGround && !player.doubleUsed) {
        player.vy = DOUBLE_JUMP_POWER;
        player.doubleUsed = true;
        player.jumping = true;
        player.rolling = false;

        if (Math.abs(player.vx) > 12) {
          player.vx *= 1.02;
        }

        sfxDoubleJump();
        spawnParticles(player.x + player.w / 2, player.y + player.h, "#b3e5fc", 12, 3);
      }

      if (player.jumping && !keys.Space && !gpJumpHeld && player.vy < -9) {
        player.vy = -9;
      }

      player.vy += GRAVITY;
      if (player.vy > 18) player.vy = 18;

      player.x += player.vx;

      if (player.x < 0) {
        player.x = 0;
        player.vx = 0;
      }

      if (player.x > level.width - player.w) {
        player.x = level.width - player.w;
        player.vx = 0;
      }

      for (const p of level.platforms) {
        if (intersects(player, p)) {
          if (player.vx > 0) {
            player.x = p.x - player.w;
          } else if (player.vx < 0) {
            player.x = p.x + p.w;
          }

          player.vx = 0;
        }
      }

      const impactVy = player.vy;

      player.y += player.vy;
      player.onGround = false;

      for (const p of level.platforms) {
        if (intersects(player, p)) {
          if (player.vy > 0) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.onGround = true;
            player.jumping = false;
            player.doubleUsed = false;

            if (impactVy > 7) {
              spawnParticles(player.x + player.w / 2, player.y + player.h, "#cfd8dc", 10, 2);
              player.squash = 0.22;
            }
          } else if (player.vy < 0) {
            player.y = p.y + p.h;
            player.vy = 0;
          }
        }
      }
    }

    function updateLoop() {
      const l = player.loop;
      if (!l) return;

      const angular = Math.abs(l.speed) / l.pathR;

      l.progress += angular;
      l.angle -= l.dir * angular;

      player.x = l.cx + Math.cos(l.angle) * l.pathR - player.w / 2;
      player.y = l.cy + Math.sin(l.angle) * l.pathR - player.h / 2;

      player.vx = l.dir * l.speed;
      player.vy = 0;
      player.onGround = false;
      player.rolling = false;
      player.facing = l.dir;

      player.spinAngle += 0.55;

      if (l.progress >= Math.PI * 2) {
        player.loop = null;
        player.x = l.cx - player.w / 2;
        player.y = l.cy + l.pathR - player.h / 2;
        player.vx = l.dir * l.speed;
        player.vy = 0;
        player.onGround = true;
        player.doubleUsed = false;
      }
    }

    function updateRail() {
      const r = player.rail;
      if (!r) return;

      if (jumpPressed) {
        player.rail = null;
        player.vy = JUMP_POWER;
        player.jumping = true;
        player.vx = r.dir * r.speed * 0.78;
        player.doubleUsed = false;
        sfxJump();
        return;
      }

      player.x += r.dir * r.speed;
      player.y = r.y - player.h;

      player.vx = r.dir * r.speed;
      player.vy = 0;
      player.onGround = false;
      player.rolling = false;
      player.facing = r.dir;

      player.spinAngle += 0.34;

      const center = player.x + player.w / 2;

      if ((r.dir > 0 && center > r.x + r.w) || (r.dir < 0 && center < r.x)) {
        player.rail = null;
        player.vx = r.dir * r.speed;
        player.vy = 0;
      }
    }

    function updateCorkscrew() {
      const c = player.corkscrew;
      if (!c) return;

      const angular = c.speed / c.r;

      c.progress += angular;

      const t = Math.min(1, c.progress / c.totalAngle);

      const baseX = c.x + c.dir * c.len * t;
      const baseY = (c.y - c.r) - c.len * t;

      c.angle -= c.dir * angular;

      player.x = baseX + Math.cos(c.angle) * c.r - player.w / 2;
      player.y = baseY + Math.sin(c.angle) * c.r - player.h / 2;

      player.vx = c.dir * c.speed;
      player.vy = 0;
      player.onGround = false;
      player.rolling = false;
      player.facing = c.dir;

      player.spinAngle += 0.55;

      if (c.progress >= c.totalAngle) {
        player.corkscrew = null;

        player.x = baseX - player.w / 2;
        player.y = baseY + c.r - player.h / 2;

        player.vx = c.dir * c.speed;
        player.vy = -3;
        player.onGround = false;
        player.doubleUsed = false;

        score += 50;
        boostMeter = Math.min(1, boostMeter + 0.22);
        flowHeat = Math.min(1, flowHeat + 0.10);

        sfxBoost();
        spawnParticles(player.x + player.w / 2, player.y + player.h / 2, "#80d8ff", 18, 6);
        addPopup(player.x + player.w / 2, player.y - 30, "CORKSCREW!", "#80d8ff");
      }
    }

    function collectRings() {
      const pcx = player.x + player.w / 2;
      const pcy = player.y + player.h / 2;

      let magnetRadius = 130 + flowHeat * 90 + (player.autoBoost > 0 ? 80 : 0);
      let magnetPower = 8 + flowHeat * 4 + (player.autoBoost > 0 ? 3 : 0);

      if (ringStorm > 0) {
        magnetRadius += 240;
        magnetPower += 7;
      }

      for (const r of level.rings) {
        if (r.taken) continue;

        const dx = pcx - r.x;
        const dy = pcy - r.y;
        const dist = Math.hypot(dx, dy);

        if (dist < magnetRadius && dist > 1) {
          r.x += (dx / dist) * magnetPower;
          r.y += (dy / dist) * magnetPower;
        }

        if (dist < 36) {
          r.taken = true;
          rings++;
          score += 10;

          boostMeter = Math.min(1, boostMeter + 0.025);
          flowHeat = Math.min(1, flowHeat + 0.035);

          sfxRing();
          spawnParticles(r.x, r.y, "#ffd54f", 8, 3);

          if (rings % 50 === 0) {
            ringStorm = 4.0;
            sfxRingStorm();
            addPopup(player.x + player.w / 2, player.y - 52, "RING STORM!", "#80d8ff");
            flash = Math.max(flash, 0.08);
            spawnParticles(pcx, pcy, "#80d8ff", 26, 7);
          }
        }
      }
    }

    function checkHearts() {
      const pcx = player.x + player.w / 2;
      const pcy = player.y + player.h / 2;

      for (const h of level.hearts) {
        if (!h.taken && Math.hypot(pcx - h.x, pcy - h.y) < 40) {
          h.taken = true;
          lives = Math.min(99, lives + 1);
          sfxHeart();
          spawnParticles(h.x, h.y, "#ff4081", 16, 4);
          addPopup(h.x, h.y - 22, "+1 LEBEN", "#ff4081");
        }
      }
    }

    function checkShields() {
      const pcx = player.x + player.w / 2;
      const pcy = player.y + player.h / 2;

      for (const s of level.shields) {
        if (!s.taken && Math.hypot(pcx - s.x, pcy - s.y) < 40) {
          s.taken = true;
          player.shield = true;
          sfxShield();
          spawnParticles(s.x, s.y, "#4fc3f7", 18, 4);
          addPopup(s.x, s.y - 22, "SCHILD", "#4fc3f7");
        }
      }
    }

    function checkCheckpoints() {
      for (const c of level.checkpoints) {
        if (!c.active && intersects(player, c)) {
          c.active = true;

          checkpoint = {
            level: currentLevel,
            x: player.x,
            y: player.y
          };

          sfxCheckpoint();
          spawnParticles(c.x + c.w / 2, c.y + 20, "#69f0ae", 18, 4);
          addPopup(c.x + c.w / 2, c.y - 12, "CHECKPOINT", "#69f0ae");
        }
      }
    }

    function checkBoosters() {
      if (player.loop || player.rail || player.corkscrew) return;

      for (const b of level.boosters) {
        if (intersects(player, b)) {
          player.vx = b.dir * b.power;
          player.facing = b.dir;

          boostMeter = Math.min(1, boostMeter + 0.22);
          flowHeat = Math.min(1, flowHeat + 0.18);

          sfxBoost();
          spawnParticles(player.x + player.w / 2, player.y + player.h, "#ff7043", 14, 5);
        }
      }
    }

    function checkSprings() {
      if (player.loop || player.rail || player.corkscrew) return;

      for (const s of level.springs) {
        if (intersects(player, s) && player.vy >= 0) {
          player.vy = -20;
          player.onGround = false;
          player.jumping = true;
          player.doubleUsed = false;
          sfxSpring();
          spawnParticles(s.x + s.w / 2, s.y, "#ffd54f", 12, 3);
        }
      }
    }

    function checkRails() {
      if (player.loop || player.rail || player.corkscrew) return;
      if (player.vy < -1) return;

      for (const r of level.rails) {
        const rect = { x: r.x, y: r.y, w: r.w, h: r.h || 16 };

        if (intersects(player, rect)) {
          player.rail = { ...r };
          player.y = r.y - player.h;
          player.vy = 0;
          player.onGround = false;
          player.rolling = false;
          player.facing = r.dir;
          sfxBoost();
          spawnParticles(player.x + player.w / 2, player.y + player.h, "#90a4ae", 12, 3);
          break;
        }
      }
    }

    function checkLoops() {
      if (player.loop || player.rail || player.corkscrew || !player.onGround) return;

      const pcx = player.x + player.w / 2;
      const pcy = player.y + player.h / 2;

      for (const l of level.loops) {
        const bottomCenterY = l.cy + l.pathR;

        if (
          Math.abs(pcx - l.cx) < 38 &&
          Math.abs(pcy - bottomCenterY) < 55 &&
          Math.abs(player.vx) > 8
        ) {
          player.loop = {
            cx: l.cx,
            cy: l.cy,
            pathR: l.pathR,
            angle: Math.PI / 2,
            dir: Math.sign(player.vx) || 1,
            speed: Math.max(10, Math.abs(player.vx)),
            progress: 0
          };

          sfxBoost();
          spawnParticles(pcx, pcy + 15, "#ffd54f", 14, 4);
          break;
        }
      }
    }

    function checkCorkscrews() {
      if (player.loop || player.rail || player.corkscrew || !player.onGround) return;

      const pcx = player.x + player.w / 2;
      const feetY = player.y + player.h;

      for (const c of level.corkscrews) {
        if (
          Math.abs(pcx - c.x) < 48 &&
          Math.abs(feetY - c.y) < 36 &&
          Math.abs(player.vx) > 8 &&
          Math.sign(player.vx) === c.dir
        ) {
          player.corkscrew = {
            ...c,
            progress: 0,
            totalAngle: c.turns * Math.PI * 2,
            speed: Math.max(10, Math.abs(player.vx)),
            angle: Math.PI / 2
          };

          sfxCorkscrew();
          spawnParticles(pcx, feetY, "#80d8ff", 18, 5);
          addPopup(pcx, player.y - 30, "CORKSCREW UP!", "#80d8ff");

          break;
        }
      }
    }

    function updateEnemies() {
      if (!level.enemies) return;

      for (const e of level.enemies) {
        if (e.dead) continue;

        e.x += e.dir * ENEMY_SPEED;

        if (e.x < e.minX || e.x + e.w > e.maxX) {
          e.dir *= -1;
        }

        if (!player.loop && !player.rail && !player.corkscrew && intersects(player, e)) {
          const attack =
            player.autoBoost > 0 ||
            player.rolling ||
            player.vy > 2 ||
            flowHeat > 0.85;

          if (attack) {
            e.dead = true;

            combo++;
            comboTimer = 2;

            const addScore = 100 + combo * 10;
            score += addScore;

            boostMeter = Math.min(1, boostMeter + 0.12);
            flowHeat = Math.min(1, flowHeat + 0.09);

            shake = Math.max(shake, 0.12);

            sfxEnemy();
            spawnParticles(e.x + e.w / 2, e.y + e.h / 2, "#ff8a65", 18, 5);
            addPopup(e.x + e.w / 2, e.y - 10, `+${addScore}`, "#ffab91");

            if (player.vy > 2) {
              player.vy = -10;
            }
          } else {
            hurtPlayer();
          }
        }
      }
    }

    function damageBoss(b) {
      b.health--;
      b.invuln = 1.6;
      b.hitFlash = 0.35;

      combo++;
      comboTimer = 2;

      const addScore = 200 + combo * 20;
      score += addScore;

      boostMeter = Math.min(1, boostMeter + 0.22);
      flowHeat = Math.min(1, flowHeat + 0.13);

      shake = Math.max(shake, 0.35);
      flash = Math.max(flash, 0.20);
      hitStop = Math.max(hitStop, 0.06);

      sfxBossHit();
      spawnParticles(b.x + b.w / 2, b.y + b.h / 2, "#ffeb3b", 28, 7);
      addPopup(b.x + b.w / 2, b.y - 14, `+${addScore}`, "#fff59d");

      if (player.vy > 2) {
        player.vy = -11;
      } else {
        player.vx = -player.facing * 6;
      }

      if (b.health <= 0) {
        pendingWin = 1.6;
        hitStop = Math.max(hitStop, 0.35);
        flash = Math.max(flash, 0.35);
        shake = Math.max(shake, 0.50);

        score += 1000;

        stopMusic();
        sfxWin();

        const colors = ["#ffd54f", "#ff80ab", "#80d8ff", "#b9f6ca", "#ff5252"];

        for (let i = 0; i < 10; i++) {
          spawnParticles(
            b.x + b.w / 2 + Math.random() * 80 - 40,
            b.y + b.h / 2 + Math.random() * 80 - 40,
            colors[i % colors.length],
            24,
            8
          );
        }

        addPopup(b.x + b.w / 2, b.y - 30, "BOSS DEFEATED!", "#ffd54f");
      }
    }

    function updateBoss() {
      const b = level.boss;
      if (!b || b.health <= 0) return;

      if (!b.phase2 && b.health === 1) {
        b.phase2 = true;

        addPopup(
          b.x + b.w / 2,
          b.y - 24,
          "BOSS PHASE 2",
          "#ff5252"
        );

        flash = Math.max(flash, 0.12);
        shake = Math.max(shake, 0.20);

        spawnParticles(
          b.x + b.w / 2,
          b.y + b.h / 2,
          "#ff5252",
          30,
          7
        );
      }

      if (b.hitFlash > 0) b.hitFlash -= STEP;
      if (b.invuln > 0) b.invuln -= STEP;

      b.phase += 0.04;
      b.timer -= STEP;
      b.shootTimer -= STEP;

      if (b.state === "hover") {
        b.vulnerable = false;

        b.dir = player.x < b.x ? -1 : 1;
        b.x += b.dir * (b.phase2 ? 1.6 : 1.1);
        b.y = b.baseY + Math.sin(b.phase) * 35;

        if (b.x < 100) b.x = 100;
        if (b.x > level.width - 200) b.x = level.width - 200;

        if (b.shootTimer <= 0) {
          if (b.phase2) {
            b.shootTimer = 1.4;

            const dir = player.x < b.x ? -1 : 1;

            level.bullets.push({
              x: b.x + b.w / 2 + dir * 45,
              y: b.y + b.h / 2,
              w: 16,
              h: 16,
              vx: dir * BOSS_BULLET_SPEED,
              vy: 0
            });

            level.bullets.push({
              x: b.x + b.w / 2 + dir * 45,
              y: b.y + b.h / 2,
              w: 16,
              h: 16,
              vx: dir * BOSS_BULLET_SPEED,
              vy: -1.2
            });

            level.bullets.push({
              x: b.x + b.w / 2 + dir * 45,
              y: b.y + b.h / 2,
              w: 16,
              h: 16,
              vx: dir * BOSS_BULLET_SPEED,
              vy: 1.2
            });
          } else {
            b.shootTimer = 2.6;

            const dir = player.x < b.x ? -1 : 1;

            level.bullets.push({
              x: b.x + b.w / 2 + dir * 45,
              y: b.y + b.h / 2,
              w: 16,
              h: 16,
              vx: dir * BOSS_BULLET_SPEED,
              vy: 0
            });
          }

          sfxShoot();
        }

        if (b.timer <= 0) {
          b.state = "vulnerable";
          b.timer = b.phase2 ? 2.2 : 3.0;
          b.vulnerable = true;
        }
      } else if (b.state === "vulnerable") {
        b.vulnerable = true;
        b.y = b.baseY + Math.sin(b.phase) * 10 + 18;

        if (b.timer <= 0) {
          b.state = "hover";
          b.timer = (b.phase2 ? 0.9 : 1.3) + Math.random() * 0.8;
          b.vulnerable = false;
          b.shootTimer = 0.8;
        }
      }

      if (!player.loop && !player.rail && !player.corkscrew && intersects(player, b)) {
        if (b.vulnerable && b.invuln <= 0) {
          damageBoss(b);
        } else if (!b.vulnerable && b.invuln <= 0) {
          hurtPlayer();
        }
      }
    }

    function updateBullets() {
      if (!level.bullets) return;

      const attack =
        player.autoBoost > 0 ||
        player.rolling ||
        player.vy > 2 ||
        flowHeat > 0.85;

      for (let i = level.bullets.length - 1; i >= 0; i--) {
        const b = level.bullets[i];

        b.x += b.vx;
        b.y += b.vy;

        if (
          b.x < -100 ||
          b.x > level.width + 100 ||
          b.y > level.bottom + 200 ||
          b.y < level.minY - 200
        ) {
          level.bullets.splice(i, 1);
          continue;
        }

        if (!player.loop && !player.rail && !player.corkscrew && intersects(player, b)) {
          if (attack) {
            combo++;
            comboTimer = 2;
            score += 10 + combo * 5;
            shake = Math.max(shake, 0.08);

            spawnParticles(b.x + b.w / 2, b.y + b.h / 2, "#ff8a80", 10, 3);
            level.bullets.splice(i, 1);
          } else {
            hurtPlayer();
            level.bullets.splice(i, 1);
          }
        }
      }
    }

    function checkSpikes() {
      if (player.loop || player.rail || player.corkscrew) return;

      for (const s of level.spikes) {
        const hit = {
          x: s.x + 10,
          y: s.y + 12,
          w: s.w - 20,
          h: s.h - 12
        };

        if (intersects(player, hit)) {
          hurtPlayer();
        }
      }
    }

    function checkGoal() {
      if (player.loop || player.rail || player.corkscrew) return;

      if (level.goal && intersects(player, level.goal)) {
        gameState = "levelClear";
        stopMusic();
        sfxLevelClear();

        flash = Math.max(flash, 0.25);

        score += rings * 100;
        score += Math.max(0, 25000 - Math.floor(time * 10));
        score += Math.floor(level.width / 8);
        score += Math.floor(flowHeat * 1200);
        score += Math.floor(Math.max(0, -cameraY) / 10);

        const colors = ["#ffd54f", "#ff80ab", "#80d8ff", "#b9f6ca"];

        for (let i = 0; i < 10; i++) {
          spawnParticles(
            level.goal.x + Math.random() * 80 - 20,
            level.goal.y + Math.random() * 140,
            colors[i % colors.length],
            26,
            8
          );
        }

        addPopup(level.goal.x + 20, level.goal.y - 30, "LEVEL CLEAR!", "#ffd54f");
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.life -= STEP;
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12;

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function updateTrail() {
      const fast =
        Math.abs(player.vx) > 10 ||
        player.autoBoost > 0 ||
        flowHeat > 0.65 ||
        ringStorm > 0 ||
        player.loop ||
        player.rail ||
        player.corkscrew;

      if (fast) {
        player.trail.push({
          x: player.x + player.w / 2,
          y: player.y + player.h / 2,
          life: 0.22
        });

        if (player.trail.length > 40) {
          player.trail.shift();
        }
      }

      for (let i = player.trail.length - 1; i >= 0; i--) {
        player.trail[i].life -= STEP;

        if (player.trail[i].life <= 0) {
          player.trail.splice(i, 1);
        }
      }
    }

        updatePopups();
        jumpPressed = false;
        return;
      }

      pollGamepad();

        hitStop -= STEP;

        if (flash > 0) flash = Math.max(0, flash - STEP);
