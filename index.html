<!-- EXTRA POLISH PACK -->
<style>
  #polishScanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 21;
    opacity: 0.12;
    background: repeating-linear-gradient(
      0deg,
      rgba(255, 255, 255, 0.035) 0px,
      rgba(255, 255, 255, 0.035) 1px,
      transparent 2px,
      transparent 4px
    );
    mix-blend-mode: overlay;
  }

  @media (prefers-reduced-motion: reduce) {
    #polishScanlines {
      display: none;
    }
  }

  .ctrl {
    transition:
      transform 60ms ease,
      background 200ms ease,
      border-color 200ms ease;
  }

  .ctrl:active {
    transform: scale(0.94);
    border-color: rgba(255, 255, 255, 0.35);
  }
</style>

<script>
  if (!window.__sdPolishPack2) {
    window.__sdPolishPack2 = true;

    const scan = document.createElement("div");
    scan.id = "polishScanlines";
    document.body.appendChild(scan);

    /* ---------------- FIXED UPDATE POLISH ---------------- */

    const originalFixedUpdate = fixedUpdate;

    fixedUpdate = function () {
      const prevGameState = gameState;
      const wasOnGround = player.onGround;
      const impactVy = player.vy;

      originalFixedUpdate();

      if (gameState === "play") {
        // Landing impact
        if (!wasOnGround && player.onGround && impactVy > 11) {
          shake = Math.max(shake, 0.12);
          spawnParticles(
            player.x + player.w / 2,
            player.y + player.h,
            "#eceff1",
            8,
            2
          );
        }

        // Rail sparks
        if (player.rail && Math.random() < 0.35) {
          spawnParticles(
            player.x + player.w / 2,
            player.y + player.h,
            "#ffe082",
            2,
            2
          );
        }

        // Goal fireworks
        if (prevGameState === "play" && gameState === "levelClear" && level.goal) {
          const colors = ["#ffd54f", "#ff80ab", "#80d8ff", "#b9f6ca"];

          for (let i = 0; i < 5; i++) {
            setTimeout(() => {
              if (level && level.goal) {
                spawnParticles(
                  level.goal.x + Math.random() * 80 - 20,
                  level.goal.y + Math.random() * 120,
                  colors[i % colors.length],
                  20,
                  6
                );
              }
            }, i * 80);
          }
        }
      }
    };

    /* ---------------- RENDER POLISH ---------------- */

    const originalRender = render;

    render = function () {
      originalRender();

      // Danger vignette when no rings and no shield
      if (gameState === "play" && rings === 0 && !player.shield) {
        const a = 0.06 + 0.04 * Math.sin(animT * 6);

        const g = ctx.createRadialGradient(
          VIEW_W / 2,
          H / 2,
          H * 0.35,
          VIEW_W / 2,
          H / 2,
          H * 0.9
        );

        g.addColorStop(0, "rgba(255,0,0,0)");
        g.addColorStop(1, `rgba(255,0,0,${a})`);

        ctx.fillStyle = g;
        ctx.fillRect(0, 0, VIEW_W, H);
      }
    };

    /* ---------------- PLAYER / MAGNET VISUAL ---------------- */

    const originalDrawPlayer = drawPlayer;

    drawPlayer = function (camX) {
      originalDrawPlayer(camX);

      if (gameState === "play" && (flowHeat > 0.4 || player.autoBoost > 0)) {
        const cx = player.x - camX + player.w / 2;
        const cy = player.y + player.h / 2;

        const radius =
          110 +
          flowHeat * 70 +
          (player.autoBoost > 0 ? 60 : 0);

        ctx.save();

        ctx.globalAlpha = 0.08 + flowHeat * 0.05;
        ctx.strokeStyle = "#8fd3ff";
        ctx.setLineDash([8, 10]);
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
      }
    };
  }
</script>
