<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Speed Dash Mobile - Easy Polish</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #040613;
      overflow: hidden;
      touch-action: none;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      border-radius: 12px;
      box-shadow: 0 12px 50px rgba(0, 0, 0, 0.55);
      image-rendering: pixelated;
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 16px;
      display: none;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 20;
      pointer-events: none;
    }

    .group {
      display: flex;
      gap: 14px;
      pointer-events: auto;
    }

    .ctrl {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.35);
      background: rgba(0, 0, 0, 0.35);
      color: white;
      font-size: 28px;
      font-weight: bold;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .ctrl.smallText {
      font-size: 16px;
    }

    .ctrl:active {
      background: rgba(255, 255, 255, 0.25);
      transform: scale(0.96);
    }

    #controls.show {
      display: flex;
    }

    @media (pointer: coarse) {
      #controls {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <canvas id="game" width="960" height="540"></canvas>

  <div id="controls">
    <div class="group">
      <button class="ctrl" data-key="ArrowLeft">◀</button>
      <button class="ctrl" data-key="ArrowRight">▶</button>
    </div>

    <div class="group">
      <button class="ctrl" data-key="ArrowDown">▼</button>
      <button class="ctrl smallText" data-key="ShiftLeft">DASH</button>
      <button class="ctrl smallText" data-key="Space">JUMP</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const W = 960;
    const H = 540;
    const STEP = 1 / 60;
    const LEVEL_COUNT = 3;

    const EASY = true;

    const START_LIVES = EASY ? 6 : 3;
    const BOSS_HEALTH = EASY ? 5 : 8;
    const ENEMY_SPEED = EASY ? 1.0 : 1.5;
    const GRAVITY = EASY ? 0.66 : 0.72;
    const JUMP_POWER = EASY ? -15.3 : -14.2;
    const ACCEL = EASY ? 0.62 : 0.55;
    const AIR_ACCEL = EASY ? 0.36 : 0.32;
    const MAX_BASE = EASY ? 9.6 : 8.8;
    const INVULN_TIME = EASY ? 2.8 : 2.0;
    const BOSS_BULLET_SPEED = EASY ? 4.3 : 5.5;

    let gameState = "title";
    let currentLevel = 0;
    let score = 0;
    let rings = 0;
    let lives = START_LIVES;
    let time = 0;
    let levelMessage = 0;
    let animT = 0;
    let checkpoint = null;

    const particles = [];

    const keys = {};
    let jumpPressed = false;
    let dashPressed = false;

    const player = {
      x: 80,
      y: 320,
      w: 26,
      h: 34,
      vx: 0,
      vy: 0,
      onGround: false,
      facing: 1,
      rolling: false,

      dashTime: 0,
      dashCooldown: 0,

      spinCharging: false,
      spinCharge: 0,
      spinDashTimer: 0,

      invuln: 0,
      spinAngle: 0,
      jumping: false,

      loop: null,
      rail: null,

      trail: []
    };

    let level = null;

    const themes = [
      { skyTop: "#69c4ff", skyBottom: "#eaffff", hill1: "#83dc8f", hill2: "#54c46c" },
      { skyTop: "#ff9a6b", skyBottom: "#ffe3c2", hill1: "#d97b6c", hill2: "#a34d5e" },
      { skyTop: "#1b1b2f", skyBottom: "#4a1e4e", hill1: "#3d1f56", hill2: "#2a103c" }
    ];

    const groundThemes = [
      { dirt: "#7b4a21", grass: "#49d651" },
      { dirt: "#6d4c41", grass: "#ffb74d" },
      { dirt: "#37474f", grass: "#b0bec5" }
    ];

    /* ---------------- CANVAS FIT / ZOOM ---------------- */

    function fitCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = W * dpr;
      canvas.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      const scale = Math.min(window.innerWidth / W, window.innerHeight / H);
      canvas.style.width = `${W * scale}px`;
      canvas.style.height = `${H * scale}px`;
    }

    window.addEventListener("resize", fitCanvas);
    fitCanvas();

    if (("ontouchstart" in window) || navigator.maxTouchPoints > 0) {
      document.getElementById("controls").classList.add("show");
    }

    /* ---------------- AUDIO / BGM ---------------- */

    let audioCtx = null;
    let masterGain = null;
    let musicGain = null;
    let sfxGain = null;
    let musicTimer = null;
    let musicStep = 0;
    let muted = false;
    let noiseBuffer = null;

    const musicPatterns = [
      {
        bpm: 150,
        bass: [36, 36, 43, 36, 41, 36, 43, 45],
        lead: [72, 76, 79, 76, 74, 76, 79, 81, 79, 76, 74, 76, 72, 74, 76, 79]
      },
      {
        bpm: 132,
        bass: [33, 33, 40, 33, 38, 33, 40, 41],
        lead: [69, 72, 76, 72, 74, 72, 76, 77, 76, 74, 72, 74, 69, 71, 72, 76]
      },
      {
        bpm: 160,
        bass: [28, 28, 35, 28, 33, 28, 35, 36],
        lead: [64, 67, 71, 67, 65, 67, 71, 72, 71, 67, 65, 67, 64, 65, 67, 71]
      }
    ];

    function initAudio() {
      if (audioCtx) {
        if (audioCtx.state === "suspended") audioCtx.resume();
        return;
      }

      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;

      audioCtx = new AC();

      masterGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : 0.5;
      masterGain.connect(audioCtx.destination);

      musicGain = audioCtx.createGain();
      musicGain.gain.value = 0.18;
      musicGain.connect(masterGain);

      sfxGain = audioCtx.createGain();
      sfxGain.gain.value = 0.35;
      sfxGain.connect(masterGain);
    }

    function toggleMute() {
      muted = !muted;
      if (masterGain) masterGain.gain.value = muted ? 0 : 0.5;
    }

    function midiToFreq(m) {
      return 440 * Math.pow(2, (m - 69) / 12);
    }

    function getNoiseBuffer() {
      if (!audioCtx) return null;
      if (noiseBuffer) return noiseBuffer;

      const len = audioCtx.sampleRate * 0.2;
      noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);

      for (let i = 0; i < len; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      return noiseBuffer;
    }

    function playSynth(midi, dur = 0.1, type = "square", gain = 0.2, slide = 0, when = 0, dest = null) {
      if (!audioCtx || muted) return;

      const t = audioCtx.currentTime + when;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();

      o.type = type;
      o.frequency.setValueAtTime(midiToFreq(midi), t);

      if (slide !== 0) {
        o.frequency.exponentialRampToValueAtTime(
          Math.max(20, midiToFreq(midi + slide)),
          t + dur
        );
      }

      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);

      o.connect(g);
      g.connect(dest || sfxGain);

      o.start(t);
      o.stop(t + dur + 0.03);
    }

    function playMusicNote(midi, dur, type, gain) {
      playSynth(midi, dur, type, gain, 0, 0, musicGain);
    }

    function playNoise(dur = 0.05, gain = 0.1, filterType = "highpass", when = 0, dest = null) {
      if (!audioCtx || muted) return;

      const buffer = getNoiseBuffer();
      if (!buffer) return;

      const src = audioCtx.createBufferSource();
      src.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = filterType;
      filter.frequency.value = filterType === "bandpass" ? 1800 : 6000;

      const g = audioCtx.createGain();
      const t = audioCtx.currentTime + when;

      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);

      src.connect(filter);
      filter.connect(g);
      g.connect(dest || musicGain);

      src.start(t);
      src.stop(t + dur + 0.02);
    }

    function playKick(when = 0, dest = null) {
      if (!audioCtx || muted) return;

      const t = audioCtx.currentTime + when;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();

      o.type = "sine";
      o.frequency.setValueAtTime(120, t);
      o.frequency.exponentialRampToValueAtTime(35, t + 0.12);

      g.gain.setValueAtTime(0.45, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);

      o.connect(g);
      g.connect(dest || musicGain);

      o.start(t);
      o.stop(t + 0.16);
    }

    function startMusic(levelIndex) {
      if (!audioCtx) return;

      stopMusic();

      const p = musicPatterns[levelIndex] || musicPatterns[0];
      musicStep = 0;

      const stepDur = 60 / p.bpm / 2;
      const ms = stepDur * 1000;

      musicTimer = setInterval(() => {
        if (muted || gameState !== "play") return;

        const idx = musicStep % 16;

        playMusicNote(
          p.bass[Math.floor(idx / 2) % p.bass.length],
          stepDur * 0.9,
          "triangle",
          0.25
        );

        playMusicNote(
          p.lead[idx % p.lead.length],
          stepDur * 0.72,
          "square",
          0.07
        );

        if (idx % 4 === 0) {
          playKick(0, musicGain);
        }

        if (idx % 2 === 0) {
          playNoise(0.03, 0.02, "highpass", 0, musicGain);
        }

        if (idx === 4 || idx === 12) {
          playNoise(0.08, 0.05, "bandpass", 0, musicGain);
        }

        musicStep++;
      }, ms);
    }

    function stopMusic() {
      if (musicTimer) {
        clearInterval(musicTimer);
        musicTimer = null;
      }
    }

    function sfxJump() {
      playSynth(72, 0.13, "square", 0.18, 12);
    }

    function sfxRing() {
      playSynth(91, 0.06, "sine", 0.16);
      playSynth(98, 0.08, "sine", 0.14, 0, 0.05);
    }

    function sfxDash() {
      playSynth(48, 0.22, "sawtooth", 0.22, 24);
    }

    function sfxCharge() {
      playSynth(60 + Math.floor(player.spinCharge * 2), 0.05, "square", 0.14);
    }

    function sfxHurt() {
      playSynth(50, 0.25, "sawtooth", 0.24, -20);
    }

    function sfxSpring() {
      playSynth(65, 0.16, "square", 0.18, 20);
    }

    function sfxBoost() {
      playSynth(55, 0.18, "sawtooth", 0.2, 28);
    }

    function sfxEnemy() {
      playSynth(70, 0.08, "square", 0.15, -10);
    }

    function sfxBossHit() {
      playSynth(38, 0.2, "square", 0.28, -12);
      playSynth(62, 0.12, "sawtooth", 0.16, 12, 0.03);
    }

    function sfxShoot() {
      playSynth(76, 0.08, "square", 0.1, -10);
    }

    function sfxCheckpoint() {
      [72, 79, 84].forEach((n, i) => {
        playSynth(n, 0.12, "square", 0.14, 0, i * 0.06);
      });
    }

    function sfxHeart() {
      [76, 83, 88].forEach((n, i) => {
        playSynth(n, 0.12, "sine", 0.16, 0, i * 0.06);
      });
    }

    function sfxLevelClear() {
      [72, 76, 79, 84].forEach((n, i) => {
        playSynth(n, 0.16, "square", 0.16, 0, i * 0.09);
      });
    }

    function sfxWin() {
      [60, 64, 67, 72, 76, 79, 84].forEach((n, i) => {
        playSynth(n, 0.18, "square", 0.16, 0, i * 0.08);
      });
    }

    /* ---------------- LEVELS ---------------- */

    function buildLevel1() {
      const platforms = [
        { x: 0, y: 480, w: 2400, h: 60 },
        { x: 2550, y: 480, w: 1050, h: 60 },
        { x: 3750, y: 480, w: 1450, h: 60 },

        { x: 700, y: 360, w: 220, h: 24 },
        { x: 1700, y: 350, w: 220, h: 24 },
        { x: 2800, y: 350, w: 220, h: 24 },
        { x: 4200, y: 350, w: 220, h: 24 }
      ];

      const loops = [
        { cx: 1300, cy: 360, r: 120, pathR: 95 }
      ];

      const boosters = [
        { x: 700, y: 456, w: 80, h: 24, dir: 1, power: 16 },
        { x: 3300, y: 456, w: 80, h: 24, dir: 1, power: 17 },
        { x: 4100, y: 456, w: 80, h: 24, dir: 1, power: 16 }
      ];

      const springs = [
        { x: 2340, y: 456, w: 48, h: 24 },
        { x: 3540, y: 456, w: 48, h: 24 }
      ];

      const spikes = [
        { x: 3050, y: 456, w: 70, h: 24 },
        { x: 4500, y: 456, w: 80, h: 24 }
      ];

      const enemies = [
        { x: 1800, y: 446, w: 34, h: 34, dir: 1, minX: 1700, maxX: 2200, dead: false },
        { x: 2700, y: 446, w: 34, h: 34, dir: -1, minX: 2600, maxX: 2850, dead: false },
        { x: 4300, y: 446, w: 34, h: 34, dir: 1, minX: 3800, maxX: 4450, dead: false }
      ];

      const checkpoints = [
        { x: 2200, y: 380, w: 26, h: 100, active: false },
        { x: 4200, y: 380, w: 26, h: 100, active: false }
      ];

      const hearts = [
        { x: 1700, y: 300, taken: false },
        { x: 4300, y: 310, taken: false }
      ];

      const rings = [];
      const add = (x, y, n = 1, dx = 38) => {
        for (let i = 0; i < n; i++) {
          rings.push({ x: x + i * dx, y, taken: false });
        }
      };

      add(250, 430, 7);
      add(720, 320, 4);
      add(1000, 430, 6);
      add(1250, 360, 5);
      add(1700, 300, 4);
      add(2100, 430, 6);
      add(2600, 430, 6);
      add(2800, 300, 4);
      add(3200, 430, 6);
      add(3800, 430, 6);
      add(4200, 300, 4);
      add(4700, 430, 6);

      return {
        name: "GREEN DASH",
        width: 5200,
        playerStart: { x: 80, y: 320 },
        platforms,
        spikes,
        springs,
        boosters,
        rails: [],
        loops,
        rings,
        enemies,
        checkpoints,
        hearts,
        goal: { x: 5050, y: 360, w: 40, h: 120 },
        boss: null,
        bullets: []
      };
    }

    function buildLevel2() {
      const platforms = [
        { x: 0, y: 480, w: 1200, h: 60 },
        { x: 2000, y: 480, w: 800, h: 60 },
        { x: 3700, y: 480, w: 800, h: 60 },
        { x: 5300, y: 480, w: 900, h: 60 },

        { x: 350, y: 360, w: 220, h: 24 },
        { x: 2300, y: 360, w: 220, h: 24 },
        { x: 4000, y: 360, w: 220, h: 24 },
        { x: 5600, y: 350, w: 220, h: 24 }
      ];

      const rails = [
        { x: 1200, y: 380, w: 800, h: 14, dir: 1, speed: 14 },
        { x: 2800, y: 350, w: 900, h: 14, dir: 1, speed: 15 },
        { x: 4500, y: 380, w: 800, h: 14, dir: 1, speed: 16 }
      ];

      const boosters = [
        { x: 880, y: 456, w: 80, h: 24, dir: 1, power: 15 },
        { x: 2480, y: 456, w: 80, h: 24, dir: 1, power: 16 },
        { x: 4180, y: 456, w: 80, h: 24, dir: 1, power: 16 }
      ];

      const springs = [
        { x: 550, y: 456, w: 48, h: 24 },
        { x: 4100, y: 456, w: 48, h: 24 }
      ];

      const spikes = [
        { x: 2450, y: 456, w: 70, h: 24 },
        { x: 4300, y: 456, w: 70, h: 24 },
        { x: 5700, y: 456, w: 70, h: 24 }
      ];

      const enemies = [
        { x: 2200, y: 446, w: 34, h: 34, dir: 1, minX: 2050, maxX: 2400, dead: false },
        { x: 3900, y: 446, w: 34, h: 34, dir: -1, minX: 3750, maxX: 4100, dead: false },
        { x: 5500, y: 446, w: 34, h: 34, dir: 1, minX: 5350, maxX: 5650, dead: false }
      ];

      const checkpoints = [
        { x: 2050, y: 380, w: 26, h: 100, active: false },
        { x: 3750, y: 380, w: 26, h: 100, active: false },
        { x: 5350, y: 380, w: 26, h: 100, active: false }
      ];

      const hearts = [
        { x: 2350, y: 310, taken: false },
        { x: 5600, y: 310, taken: false }
      ];

      const rings = [];
      const add = (x, y, n = 1, dx = 38) => {
        for (let i = 0; i < n; i++) {
          rings.push({ x: x + i * dx, y, taken: false });
        }
      };

      add(250, 430, 7);
      add(380, 320, 3);
      add(950, 430, 6);
      add(1300, 330, 6, 120);
      add(2100, 430, 6);
      add(2350, 320, 3);
      add(2900, 300, 6, 140);
      add(3800, 430, 6);
      add(4050, 320, 3);
      add(4600, 330, 6, 120);
      add(5400, 430, 7);
      add(5650, 310, 3);

      return {
        name: "RAIL RUINS",
        width: 6200,
        playerStart: { x: 80, y: 320 },
        platforms,
        spikes,
        springs,
        boosters,
        rails,
        loops: [],
        rings,
        enemies,
        checkpoints,
        hearts,
        goal: { x: 6000, y: 360, w: 40, h: 120 },
        boss: null,
        bullets: []
      };
    }

    function createBoss() {
      return {
        x: 1200,
        y: 300,
        w: 90,
        h: 90,
        baseY: 300,
        health: BOSS_HEALTH,
        maxHealth: BOSS_HEALTH,
        state: "hover",
        timer: EASY ? 2.0 : 2.5,
        invuln: 0,
        dir: -1,
        phase: 0,
        vulnerable: false,
        hitFlash: 0,
        shootTimer: EASY ? 1.8 : 1.2
      };
    }

    function buildLevel3() {
      const platforms = [
        { x: 0, y: 480, w: 1600, h: 60 },
        { x: 220, y: 360, w: 220, h: 24 },
        { x: 1160, y: 360, w: 220, h: 24 }
      ];

      const rings = [];
      const add = (x, y, n = 1, dx = 38) => {
        for (let i = 0; i < n; i++) {
          rings.push({ x: x + i * dx, y, taken: false });
        }
      };

      add(250, 430, 6);
      add(700, 430, 6);
      add(1150, 430, 6);
      add(260, 320, 3);
      add(1200, 320, 3);

      const hearts = [
        { x: 800, y: 430, taken: false }
      ];

      return {
        name: "BOSS CORE",
        width: 1600,
        playerStart: { x: 100, y: 320 },
        platforms,
        spikes: [],
        springs: [],
        boosters: [],
        rails: [],
        loops: [],
        rings,
        enemies: [],
        checkpoints: [],
        hearts,
        goal: null,
        boss: createBoss(),
        bullets: []
      };
    }

    function buildLevel(index) {
      if (index === 0) return buildLevel1();
      if (index === 1) return buildLevel2();
      return buildLevel3();
    }

    function loadLevel(index) {
      level = buildLevel(index);
      currentLevel = index;
      time = 0;
      rings = 0;
      levelMessage = 2.2;

      particles.length = 0;
      player.trail.length = 0;

      let startX = level.playerStart.x;
      let startY = level.playerStart.y;

      if (checkpoint && checkpoint.level === index) {
        startX = checkpoint.x;
        startY = checkpoint.y;
      }

      player.x = startX;
      player.y = startY;
      player.vx = 0;
      player.vy = 0;
      player.onGround = false;
      player.facing = 1;
      player.rolling = false;

      player.dashTime = 0;
      player.dashCooldown = 0;

      player.spinCharging = false;
      player.spinCharge = 0;
      player.spinDashTimer = 0;

      player.invuln = 0;
      player.spinAngle = 0;
      player.jumping = false;

      player.loop = null;
      player.rail = null;
    }

    /* ---------------- INPUT ---------------- */

    function handleMenuButton() {
      initAudio();

      if (gameState === "title") {
        checkpoint = null;
        score = 0;
        lives = START_LIVES;
        loadLevel(0);
        gameState = "levelIntro";
      } else if (gameState === "levelIntro") {
        gameState = "play";
        startMusic(currentLevel);
      } else if (gameState === "dead") {
        loadLevel(currentLevel);
        gameState = "levelIntro";
      } else if (gameState === "levelClear") {
        checkpoint = null;
        const next = currentLevel + 1;

        if (next >= LEVEL_COUNT) {
          gameState = "win";
          sfxWin();
        } else {
          loadLevel(next);
          gameState = "levelIntro";
        }
      } else if (gameState === "gameover" || gameState === "win") {
        checkpoint = null;
        gameState = "title";
        stopMusic();
      }

      jumpPressed = false;
      dashPressed = false;
    }

    function pressControl(code) {
      initAudio();

      if (["Space", "ArrowUp", "KeyW"].includes(code)) {
        jumpPressed = true;
      }

      if (["ShiftLeft", "ShiftRight", "KeyX"].includes(code)) {
        dashPressed = true;
      }

      keys[code] = true;

      if (gameState !== "play" && ["Space", "Enter"].includes(code)) {
        handleMenuButton();
      }
    }

    function releaseControl(code) {
      keys[code] = false;

      if (gameState === "play" && code === "Space" && player.vy < -6) {
        player.vy = -6;
      }
    }

    window.addEventListener("keydown", (e) => {
      if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
        e.preventDefault();
      }

      if (e.code === "KeyM") {
        toggleMute();
      }

      if (!keys[e.code]) {
        pressControl(e.code);

        if (["Enter", "Space"].includes(e.code) && gameState !== "play") {
          handleMenuButton();
        }
      }

      keys[e.code] = true;
    });

    window.addEventListener("keyup", (e) => {
      releaseControl(e.code);
    });

    canvas.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      initAudio();

      if (gameState !== "play") {
        handleMenuButton();
      }
    });

    document.querySelectorAll(".ctrl").forEach((btn) => {
      const code = btn.dataset.key;

      btn.addEventListener("pointerdown", (e) => {
        e.preventDefault();
        e.stopPropagation();
        pressControl(code);
        btn.classList.add("active");
      });

      const release = (e) => {
        e.preventDefault();
        e.stopPropagation();
        releaseControl(code);
        btn.classList.remove("active");
      };

      btn.addEventListener("pointerup", release);
      btn.addEventListener("pointercancel", release);
      btn.addEventListener("pointerleave", release);
      btn.addEventListener("contextmenu", (e) => e.preventDefault());
    });

    /* ---------------- HELPERS ---------------- */

    function intersects(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function spawnParticles(x, y, color, n = 8, speed = 3) {
      for (let i = 0; i < n; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * speed * 2,
          vy: (Math.random() - 0.7) * speed * 2,
          life: 0.35 + Math.random() * 0.35,
          color,
          size: 2 + Math.random() * 3
        });
      }
    }

    function hurtPlayer() {
      if (player.invuln > 0) return;

      if (rings > 0) {
        rings = 0;
        player.invuln = INVULN_TIME;
        player.vy = -9;
        player.vx = -player.facing * 7;
        sfxHurt();
        spawnParticles(player.x + player.w / 2, player.y + player.h / 2, "#ffd54f", 16, 5);
      } else {
        killPlayer();
      }
    }

    function killPlayer() {
      if (gameState !== "play") return;

      lives--;
      stopMusic();
      sfxHurt();
      spawnParticles(player.x + player.w / 2, player.y + player.h / 2, "#ff5252", 22, 6);

      if (lives <= 0) {
        gameState = "gameover";
      } else {
        gameState = "dead";
      }
    }

    /* ---------------- UPDATE ---------------- */

    function updateNormal() {
      const left = keys.ArrowLeft || keys.KeyA;
      const right = keys.ArrowRight || keys.KeyD;
      const down = keys.ArrowDown || keys.KeyS;

      if (player.onGround && down && Math.abs(player.vx) > 3.5) {
        player.rolling = true;
      }

      if (player.rolling && (!down || Math.abs(player.vx) < 1.5 || !player.onGround)) {
        player.rolling = false;
      }

      if (player.onGround && down && !player.rolling) {
        player.spinCharging = true;

        if (left) player.facing = -1;
        if (right) player.facing = 1;

        if (jumpPressed) {
          player.spinCharge = Math.min(14, player.spinCharge + 3.5);
          sfxCharge();
        }

        player.vx *= 0.82;
        if (Math.abs(player.vx) < 0.2) player.vx = 0;
      } else {
        if (player.spinCharging && player.spinCharge > 0) {
          player.vx = player.facing * (9 + player.spinCharge);
          player.spinDashTimer = 0.35;
          player.rolling = false;
          sfxDash();
          spawnParticles(player.x + player.w / 2, player.y + player.h, "#8fd3ff", 12, 4);
        }

        player.spinCharging = false;
        player.spinCharge = 0;

        const maxSpeed =
          player.spinDashTimer > 0 ? 24 :
          player.dashTime > 0 ? 17 :
          player.rolling ? 12 : MAX_BASE;

        if (player.dashTime > 0) {
          player.vx = player.facing * 17;
        } else {
          if (left && !right) {
            player.vx -= player.onGround ? ACCEL : AIR_ACCEL;
            player.facing = -1;
          }

          if (right && !left) {
            player.vx += player.onGround ? ACCEL : AIR_ACCEL;
            player.facing = 1;
          }

          if ((!left && !right) || (left && right)) {
            const friction =
              player.onGround ?
                (player.spinDashTimer > 0 ? 0.995 : player.rolling ? 0.99 : 0.93) :
                0.985;

            player.vx *= friction;

            if (Math.abs(player.vx) < 0.12) {
              player.vx = 0;
            }
          }

          if (Math.abs(player.vx) > maxSpeed) {
            player.vx = Math.sign(player.vx) * maxSpeed;
          }
        }

        if (jumpPressed && player.onGround) {
          player.vy = JUMP_POWER;
          player.onGround = false;
          player.jumping = true;
          player.rolling = false;
          sfxJump();
        }

        if (player.jumping && !keys.Space && player.vy < -7) {
          player.vy = -7;
        }

        if (dashPressed && player.onGround && player.dashCooldown <= 0) {
          player.dashTime = 0.26;
          player.dashCooldown = 0.6;
          player.vx = player.facing * 17;
          player.rolling = false;
          sfxDash();
          spawnParticles(player.x + player.w / 2, player.y + player.h, "#8fd3ff", 12, 4);
        }
      }

      player.vy += GRAVITY;
      if (player.vy > 18) player.vy = 18;

      player.x += player.vx;

      if (player.x < 0) {
        player.x = 0;
        player.vx = 0;
      }

      if (player.x > level.width - player.w) {
        player.x = level.width - player.w;
        player.vx = 0;
      }

      for (const p of level.platforms) {
        if (intersects(player, p)) {
          if (player.vx > 0) {
            player.x = p.x - player.w;
          } else if (player.vx < 0) {
            player.x = p.x + p.w;
          }

          player.vx = 0;
          player.dashTime = 0;
        }
      }

      player.y += player.vy;
      player.onGround = false;

      for (const p of level.platforms) {
        if (intersects(player, p)) {
          if (player.vy > 0) {
            player.y = p.y - player.h;
            player.vy = 0;
            player.onGround = true;
            player.jumping = false;
          } else if (player.vy < 0) {
            player.y = p.y + p.h;
            player.vy = 0;
          }
        }
      }
    }

    function updateLoop() {
      const l = player.loop;
      if (!l) return;

      const angular = Math.abs(l.speed) / l.pathR;

      l.progress += angular;
      l.angle += l.dir * angular;

      player.x = l.cx + Math.cos(l.angle) * l.pathR - player.w / 2;
      player.y = l.cy + Math.sin(l.angle) * l.pathR - player.h / 2;

      player.vx = l.dir * l.speed;
      player.vy = 0;
      player.onGround = false;
      player.rolling = false;
      player.spinCharging = false;
      player.spinCharge = 0;

      player.spinAngle += 0.5;

      if (l.progress >= Math.PI * 2) {
        player.loop = null;
        player.x = l.cx - player.w / 2;
        player.y = l.cy + l.pathR - player.h / 2;
        player.vx = l.dir * l.speed;
        player.vy = 0;
        player.onGround = true;
      }
    }

    function updateRail() {
      const r = player.rail;
      if (!r) return;

      if (jumpPressed) {
        player.rail = null;
        player.vy = JUMP_POWER;
        player.jumping = true;
        player.vx = r.dir * r.speed * 0.7;
        sfxJump();
        return;
      }

      player.x += r.dir * r.speed;
      player.y = r.y - player.h;

      player.vx = r.dir * r.speed;
      player.vy = 0;
      player.onGround = false;
      player.rolling = false;
      player.spinCharging = false;
      player.spinCharge = 0;
      player.facing = r.dir;

      player.spinAngle += 0.3;

      const center = player.x + player.w / 2;

      if ((r.dir > 0 && center > r.x + r.w) || (r.dir < 0 && center < r.x)) {
        player.rail = null;
        player.vx = r.dir * r.speed;
        player.vy = 0;
      }
    }

    function collectRings() {
      const pcx = player.x + player.w / 2;
      const pcy = player.y + player.h / 2;

      for (const r of level.rings) {
        if (!r.taken && Math.hypot(pcx - r.x, pcy - r.y) < 34) {
          r.taken = true;
          rings++;
          score += 10;
          sfxRing();
          spawnParticles(r.x, r.y, "#ffd54f", 8, 3);
        }
      }
    }

    function checkHearts() {
      const pcx = player.x + player.w / 2;
      const pcy = player.y + player.h / 2;

      for (const h of level.hearts) {
        if (!h.taken && Math.hypot(pcx - h.x, pcy - h.y) < 36) {
          h.taken = true;
          lives = Math.min(9, lives + 1);
          sfxHeart();
          spawnParticles(h.x, h.y, "#ff4081", 14, 4);
        }
      }
    }

    function checkCheckpoints() {
      for (const c of level.checkpoints) {
        if (!c.active && intersects(player, c)) {
          c.active = true;
          checkpoint = {
            level: currentLevel,
            x: player.x,
            y: player.y
          };

          sfxCheckpoint();
          spawnParticles(c.x + c.w / 2, c.y + 20, "#69f0ae", 16, 4);
        }
      }
    }

    function checkBoosters() {
      if (player.loop || player.rail) return;

      for (const b of level.boosters) {
        if (intersects(player, b)) {
          player.vx = b.dir * b.power;
          player.facing = b.dir;
          player.spinDashTimer = Math.max(player.spinDashTimer, 0.15);
          sfxBoost();
          spawnParticles(player.x + player.w / 2, player.y + player.h, "#ff7043", 10, 4);
        }
      }
    }

    function checkSprings() {
      if (player.loop || player.rail) return;

      for (const s of level.springs) {
        if (intersects(player, s) && player.vy >= 0) {
          player.vy = -19;
          player.onGround = false;
          player.jumping = true;
          sfxSpring();
          spawnParticles(s.x + s.w / 2, s.y, "#ffd54f", 10, 3);
        }
      }
    }

    function checkRails() {
      if (player.loop || player.rail) return;
      if (player.vy < -1) return;

      for (const r of level.rails) {
        const rect = { x: r.x, y: r.y, w: r.w, h: r.h || 16 };

        if (intersects(player, rect)) {
          player.rail = { ...r };
          player.y = r.y - player.h;
          player.vy = 0;
          player.onGround = false;
          player.rolling = false;
          player.spinCharging = false;
          player.spinCharge = 0;
          player.facing = r.dir;
          sfxBoost();
          spawnParticles(player.x + player.w / 2, player.y + player.h, "#90a4ae", 10, 3);
          break;
        }
      }
    }

    function checkLoops() {
      if (player.loop || player.rail || !player.onGround) return;

      const pcx = player.x + player.w / 2;
      const pcy = player.y + player.h / 2;

      for (const l of level.loops) {
        const bottomCenterY = l.cy + l.pathR;

        if (
          Math.abs(pcx - l.cx) < 35 &&
          Math.abs(pcy - bottomCenterY) < 50 &&
          Math.abs(player.vx) > 6
        ) {
          player.loop = {
            cx: l.cx,
            cy: l.cy,
            pathR: l.pathR,
            angle: Math.PI / 2,
            dir: Math.sign(player.vx) || 1,
            speed: Math.max(8, Math.abs(player.vx)),
            progress: 0
          };

          sfxDash();
          spawnParticles(pcx, pcy + 15, "#ffd54f", 12, 4);
          break;
        }
      }
    }

    function updateEnemies() {
      if (!level.enemies) return;

      for (const e of level.enemies) {
        if (e.dead) continue;

        e.x += e.dir * ENEMY_SPEED;

        if (e.x < e.minX || e.x + e.w > e.maxX) {
          e.dir *= -1;
        }

        if (!player.loop && !player.rail && intersects(player, e)) {
          const attack =
            player.spinDashTimer > 0 ||
            player.dashTime > 0 ||
            player.rolling ||
            player.vy > 2;

          if (attack) {
            e.dead = true;
            score += 100;
            sfxEnemy();
            spawnParticles(e.x + e.w / 2, e.y + e.h / 2, "#ff8a65", 16, 5);

            if (player.vy > 2) {
              player.vy = -10;
            }
          } else {
            hurtPlayer();
          }
        }
      }
    }

    function updateBoss() {
      const b = level.boss;
      if (!b || b.health <= 0) return;

      if (b.hitFlash > 0) b.hitFlash -= STEP;
      if (b.invuln > 0) b.invuln -= STEP;

      b.phase += 0.04;
      b.timer -= STEP;
      b.shootTimer -= STEP;

      if (b.state === "hover") {
        b.vulnerable = false;

        b.dir = player.x < b.x ? -1 : 1;
        b.x += b.dir * (EASY ? 1.3 : 1.8);
        b.y = b.baseY + Math.sin(b.phase) * 35;

        if (b.x < 100) b.x = 100;
        if (b.x > level.width - 190) b.x = level.width - 190;

        if (b.shootTimer <= 0) {
          b.shootTimer = EASY ? 1.8 : 1.4;

          const dir = player.x < b.x ? -1 : 1;

          level.bullets.push({
            x: b.x + b.w / 2 + dir * 40,
            y: b.y + b.h / 2,
            w: 14,
            h: 14,
            vx: dir * BOSS_BULLET_SPEED,
            vy: 0
          });

          sfxShoot();
        }

        if (b.timer <= 0) {
          b.state = "vulnerable";
          b.timer = EASY ? 2.0 : 1.7;
          b.vulnerable = true;
        }
      } else if (b.state === "vulnerable") {
        b.vulnerable = true;
        b.y = b.baseY + Math.sin(b.phase) * 10 + 15;

        if (b.timer <= 0) {
          b.state = "hover";
          b.timer = (EASY ? 1.8 : 2.2) + Math.random() * 1.0;
          b.vulnerable = false;
          b.shootTimer = 0.5;
        }
      }

      if (!player.loop && !player.rail && intersects(player, b)) {
        const attack =
          player.spinDashTimer > 0 ||
          player.dashTime > 0 ||
          player.rolling ||
          player.vy > 2;

        if (b.vulnerable && b.invuln <= 0 && attack) {
          b.health--;
          b.invuln = 1.2;
          b.hitFlash = 0.3;
          score += 200;
          sfxBossHit();
          spawnParticles(b.x + b.w / 2, b.y + b.h / 2, "#ffeb3b", 22, 6);

          if (player.vy > 2) {
            player.vy = -11;
          }

          player.vx = -player.facing * 6;

          if (b.health <= 0) {
            gameState = "win";
            stopMusic();
            sfxWin();
            score += 1000;
            spawnParticles(b.x + b.w / 2, b.y + b.h / 2, "#ff5252", 40, 8);
            return;
          }
        } else if (b.invuln <= 0) {
          hurtPlayer();
        }
      }
    }

    function updateBullets() {
      if (!level.bullets) return;

      for (let i = level.bullets.length - 1; i >= 0; i--) {
        const b = level.bullets[i];

        b.x += b.vx;
        b.y += b.vy;

        if (b.x < -100 || b.x > level.width + 100 || b.y > H + 200) {
          level.bullets.splice(i, 1);
          continue;
        }

        if (!player.loop && !player.rail && intersects(player, b)) {
          hurtPlayer();
          level.bullets.splice(i, 1);
        }
      }
    }

    function checkSpikes() {
      if (player.loop || player.rail) return;

      for (const s of level.spikes) {
        const hit = {
          x: s.x + 8,
          y: s.y + 10,
          w: s.w - 16,
          h: s.h - 10
        };

        if (intersects(player, hit)) {
          hurtPlayer();
        }
      }
    }

    function checkGoal() {
      if (player.loop || player.rail) return;

      if (level.goal && intersects(player, level.goal)) {
        gameState = "levelClear";
        stopMusic();
        sfxLevelClear();
        score += rings * 100 + Math.max(0, 10000 - Math.floor(time * 10));
        spawnParticles(level.goal.x + 20, level.goal.y + 40, "#ffd54f", 30, 7);
      }
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        p.life -= STEP;
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.12;

        if (p.life <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function updateTrail() {
      const fast =
        Math.abs(player.vx) > 10 ||
        player.spinDashTimer > 0 ||
        player.dashTime > 0 ||
        player.loop ||
        player.rail;

      if (fast) {
        player.trail.push({
          x: player.x + player.w / 2,
          y: player.y + player.h / 2,
          life: 0.22
        });

        if (player.trail.length > 28) {
          player.trail.shift();
        }
      }

      for (let i = player.trail.length - 1; i >= 0; i--) {
        player.trail[i].life -= STEP;

        if (player.trail[i].life <= 0) {
          player.trail.splice(i, 1);
        }
      }
    }

    function fixedUpdate() {
      if (gameState !== "play") {
        jumpPressed = false;
        dashPressed = false;
        return;
      }

      time += STEP;

      if (levelMessage > 0) levelMessage -= STEP;

      if (player.invuln > 0) player.invuln -= STEP;
      if (player.dashTime > 0) player.dashTime -= STEP;
      if (player.dashCooldown > 0) player.dashCooldown -= STEP;
      if (player.spinDashTimer > 0) player.spinDashTimer -= STEP;

      if (player.loop) {
        updateLoop();
      } else if (player.rail) {
        updateRail();
      } else {
        updateNormal();
        checkBoosters();
        checkSprings();
        checkRails();
        checkLoops();
      }

      collectRings();
      checkHearts();
      checkCheckpoints();
      updateEnemies();

      if (level.boss) {
        updateBoss();
      }

      updateBullets();
      checkSpikes();
      checkGoal();
      updateParticles();
      updateTrail();

      if (player.y > H + 300) {
        killPlayer();
      }

      player.spinAngle += Math.abs(player.vx) * 0.06 + (player.onGround ? 0.02 : 0.28);

      jumpPressed = false;
      dashPressed = false;
    }

    /* ---------------- DRAW ---------------- */

    function mod(a, n) {
      return ((a % n) + n) % n;
    }

    function drawCloud(x, y) {
      ctx.beginPath();
      ctx.arc(x, y, 26, 0, Math.PI * 2);
      ctx.arc(x + 30, y - 10, 30, 0, Math.PI * 2);
      ctx.arc(x + 65, y, 26, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBackground(camX) {
      const theme = themes[currentLevel] || themes[0];

      const sky = ctx.createLinearGradient(0, 0, 0, H);
      sky.addColorStop(0, theme.skyTop);
      sky.addColorStop(1, theme.skyBottom);

      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, W, H);

      if (currentLevel === 2) {
        ctx.fillStyle = "rgba(255,255,255,0.8)";

        for (let i = 0; i < 70; i++) {
          const x = mod(i * 137 - camX * 0.05, W);
          const y = (i * 61) % 240 + 15;
          const size = (i % 3) + 1;

          ctx.fillRect(x, y, size, size);
        }

        ctx.fillStyle = "#e6e6fa";
        ctx.beginPath();
        ctx.arc(W - 150, 90, 38, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = theme.skyTop;
        ctx.beginPath();
        ctx.arc(W - 165, 80, 34, 0, Math.PI * 2);
        ctx.fill();
      } else {
        const sunX = W - 150 - mod(camX * 0.03, 40);
        const sunY = 90;

        ctx.fillStyle = "rgba(255,255,180,0.35)";
        ctx.beginPath();
        ctx.arc(sunX, sunY, 65, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#fff176";
        ctx.beginPath();
        ctx.arc(sunX, sunY, 40, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = "rgba(255,255,255,0.82)";
      for (let i = 0; i < 5; i++) {
        const x = mod(i * 320 - camX * 0.12, W + 320) - 160;
        const y = 60 + i * 22;
        drawCloud(x, y);
      }

      ctx.fillStyle = theme.hill1;
      const off1 = mod(camX * 0.22, 560);

      for (let i = -1; i <= Math.ceil(W / 560) + 1; i++) {
        const x = i * 560 - off1;
        ctx.beginPath();
        ctx.arc(x, H + 130, 230, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.fillStyle = theme.hill2;
      const off2 = mod(camX * 0.42, 420);

      for (let i = -1; i <= Math.ceil(W / 420) + 1; i++) {
        const x = i * 420 - off2;
        ctx.beginPath();
        ctx.arc(x, H + 160, 190, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawLoop(l, camX) {
      const x = l.cx - camX;

      if (x + l.r < -100 || x - l.r > W + 100) return;

      ctx.strokeStyle = "rgba(255,213,79,0.35)";
      ctx.lineWidth = 20;
      ctx.beginPath();
      ctx.arc(x, l.cy, l.r + 5, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = "#ffd54f";
      ctx.lineWidth = 12;
      ctx.beginPath();
      ctx.arc(x, l.cy, l.r, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = "#fff176";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(x, l.cy, l.r - 8, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawRail(r, camX) {
      const x = r.x - camX;

      if (x + r.w < -100 || x > W + 100) return;

      ctx.fillStyle = "#546e7a";

      for (let i = 0; i < r.w; i += 120) {
        ctx.fillRect(x + i, r.y + 8, 6, H - (r.y + 8));
      }

      ctx.strokeStyle = "#90a4ae";
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(x, r.y + 8);
      ctx.lineTo(x + r.w, r.y + 8);
      ctx.stroke();

      ctx.strokeStyle = "#eceff1";
      ctx.lineWidth = 3;
      ctx.setLineDash([18, 14]);
      ctx.beginPath();
      ctx.moveTo(x, r.y + 8);
      ctx.lineTo(x + r.w, r.y + 8);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    function drawBooster(b, camX) {
      const x = b.x - camX;

      if (x + b.w < 0 || x > W) return;

      ctx.fillStyle = "#ff7043";
      ctx.fillRect(x, b.y, b.w, b.h);

      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.fillRect(x, b.y, b.w, 5);

      const offset = Math.floor(animT * 20) % 18;

      ctx.fillStyle = "#ffffff";

      for (let i = 8 + offset; i < b.w - 12; i += 18) {
        ctx.beginPath();

        if (b.dir > 0) {
          ctx.moveTo(x + i, b.y + 5);
          ctx.lineTo(x + i, b.y + b.h - 5);
          ctx.lineTo(x + i + 10, b.y + b.h / 2);
        } else {
          ctx.moveTo(x + i + 10, b.y + 5);
          ctx.lineTo(x + i + 10, b.y + b.h - 5);
          ctx.lineTo(x + i, b.y + b.h / 2);
        }

        ctx.closePath();
        ctx.fill();
      }
    }

    function drawSpring(s, camX) {
      const x = s.x - camX;

      if (x + s.w < 0 || x > W) return;

      ctx.fillStyle = "#c62828";
      ctx.fillRect(x, s.y + 10, s.w, s.h - 10);

      ctx.fillStyle = "#ffd54f";
      ctx.fillRect(x + 4, s.y, s.w - 8, 12);

      ctx.fillStyle = "#fff59d";
      ctx.fillRect(x + 4, s.y, s.w - 8, 4);
    }

    function drawSpike(s, camX) {
      const x = s.x - camX;

      if (x + s.w < 0 || x > W) return;

      ctx.fillStyle = "#cfd8dc";

      for (let i = 0; i < s.w; i += 18) {
        ctx.beginPath();
        ctx.moveTo(x + i, s.y + s.h);
        ctx.lineTo(x + i + 9, s.y);
        ctx.lineTo(x + i + 18, s.y + s.h);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = "rgba(255,255,255,0.25)";

      for (let i = 0; i < s.w; i += 18) {
        ctx.beginPath();
        ctx.moveTo(x + i + 4, s.y + s.h);
        ctx.lineTo(x + i + 9, s.y + 5);
        ctx.lineTo(x + i + 11, s.y + s.h);
        ctx.closePath();
        ctx.fill();
      }
    }

    function drawRing(x, y) {
      if (x < -50 || x > W + 50) return;

      const pulse = Math.sin(animT * 6 + x * 0.02) * 1.5;

      ctx.strokeStyle = "#ffb300";
      ctx.lineWidth = 7;
      ctx.beginPath();
      ctx.arc(x, y, 14 + pulse, 0, Math.PI * 2);
      ctx.stroke();

      ctx.strokeStyle = "#fff176";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(x, y, 10 + pulse * 0.5, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawEnemy(e, camX) {
      const x = e.x - camX;

      if (x + e.w < 0 || x > W) return;

      ctx.fillStyle = "#c62828";
      ctx.fillRect(x, e.y + 8, e.w, e.h - 8);

      ctx.fillStyle = "#eceff1";
      ctx.fillRect(x + 4, e.y, e.w - 8, 12);

      ctx.fillStyle = "#111";
      ctx.beginPath();
      ctx.arc(x + 10, e.y + 20, 4, 0, Math.PI * 2);
      ctx.arc(x + 24, e.y + 20, 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#212121";
      ctx.beginPath();
      ctx.arc(x + 8, e.y + e.h, 6, 0, Math.PI * 2);
      ctx.arc(x + 26, e.y + e.h, 6, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawCheckpoint(c, camX) {
      const x = c.x - camX;

      if (x + 80 < 0 || x > W + 80) return;

      ctx.fillStyle = "#90a4ae";
      ctx.fillRect(x + 10, c.y, 6, c.h);

      ctx.fillStyle = c.active ? "#69f0ae" : "#ffd54f";

      ctx.beginPath();
      ctx.moveTo(x + 16, c.y + 5);
      ctx.lineTo(x + 52, c.y + 18);
      ctx.lineTo(x + 16, c.y + 31);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#455a64";
      ctx.fillRect(x, c.y + c.h - 8, 26, 8);
    }

    function drawHeart(x, y, scale = 1) {
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(scale, scale);

      ctx.fillStyle = "#ff4081";
      ctx.beginPath();
      ctx.moveTo(0, 5);
      ctx.bezierCurveTo(12, -8, 20, 8, 0, 20);
      ctx.bezierCurveTo(-20, 8, -12, -8, 0, 5);
      ctx.fill();

      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.beginPath();
      ctx.arc(-5, 2, 3, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawGoal(camX) {
      if (!level.goal) return;

      const x = level.goal.x - camX;

      if (x + level.goal.w < -100 || x > W + 100) return;

      ctx.fillStyle = "#cfd8dc";
      ctx.fillRect(x + 16, level.goal.y, 8, level.goal.h);

      ctx.fillStyle = "#e53935";
      ctx.fillRect(x - 25, level.goal.y, 80, 40);

      ctx.fillStyle = "#fff";
      ctx.font = "bold 22px Arial";
      ctx.textAlign = "center";
      ctx.fillText("ZIEL", x + 15, level.goal.y + 28);
    }

    function drawBoss(camX) {
      const b = level.boss;
      if (!b || b.health <= 0) return;

      const x = b.x - camX;
      const y = b.y;

      if (x + b.w < -100 || x > W + 100) return;

      ctx.save();

      if (b.invuln > 0 && Math.floor(b.invuln * 14) % 2 === 0) {
        ctx.globalAlpha = 0.55;
      }

      ctx.fillStyle = b.hitFlash > 0 ? "#ffffff" : "#7e57c2";
      ctx.fillRect(x, y, b.w, b.h);

      ctx.fillStyle = "#4527a0";
      ctx.fillRect(x + 10, y + 10, b.w - 20, b.h - 20);

      ctx.fillStyle = b.vulnerable ? "#ffeb3b" : "#ff1744";
      ctx.beginPath();
      ctx.arc(x + b.w / 2, y + b.h / 2, b.vulnerable ? 18 : 12, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x + 15, y + 18, 18, 10);
      ctx.fillRect(x + b.w - 33, y + 18, 18, 10);

      ctx.restore();
    }

    function drawBullet(b, camX) {
      const x = b.x - camX;

      if (x + b.w < 0 || x > W) return;

      ctx.fillStyle = "#ff5252";
      ctx.beginPath();
      ctx.arc(x + b.w / 2, b.y + b.h / 2, b.w / 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffcdd2";
      ctx.beginPath();
      ctx.arc(x + b.w / 2 - 3, b.y + b.h / 2 - 3, 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawWorld(camX) {
      const gt = groundThemes[currentLevel] || groundThemes[0];

      for (const l of level.loops) {
        drawLoop(l, camX);
      }

      for (const p of level.platforms) {
        const x = p.x - camX;

        if (x + p.w < 0 || x > W) continue;

        ctx.fillStyle = gt.dirt;
        ctx.fillRect(x, p.y, p.w, p.h);

        ctx.fillStyle = "rgba(0,0,0,0.15)";
        ctx.fillRect(x, p.y + 10, p.w, p.h - 10);

        ctx.fillStyle = gt.grass;
        ctx.fillRect(x, p.y, p.w, 10);

        ctx.fillStyle = "rgba(255,255,255,0.15)";
        ctx.fillRect(x, p.y, p.w, 4);
      }

      for (const c of level.checkpoints) {
        drawCheckpoint(c, camX);
      }

      for (const r of level.rails) {
        drawRail(r, camX);
      }

      for (const b of level.boosters) {
        drawBooster(b, camX);
      }

      for (const s of level.springs) {
        drawSpring(s, camX);
      }

      for (const s of level.spikes) {
        drawSpike(s, camX);
      }

      for (const h of level.hearts) {
        if (!h.taken) {
          const pulse = 1 + Math.sin(animT * 4) * 0.08;
          drawHeart(h.x - camX, h.y, pulse);
        }
      }

      for (const r of level.rings) {
        if (!r.taken) {
          drawRing(r.x - camX, r.y);
        }
      }

      for (const e of level.enemies) {
        if (!e.dead) {
          drawEnemy(e, camX);
        }
      }

      drawGoal(camX);
      drawBoss(camX);

      for (const b of level.bullets) {
        drawBullet(b, camX);
      }
    }

    function drawTrail(camX) {
      for (const t of player.trail) {
        const x = t.x - camX;
        const a = Math.max(0, t.life / 0.22) * 0.25;

        ctx.fillStyle = `rgba(89,182,255,${a})`;
        ctx.beginPath();
        ctx.arc(x, t.y, 10 * (t.life / 0.22) + 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawParticles(camX) {
      for (const p of particles) {
        const x = p.x - camX;

        if (x < -20 || x > W + 20) continue;

        ctx.globalAlpha = Math.min(1, p.life * 2);
        ctx.fillStyle = p.color;

        ctx.beginPath();
        ctx.arc(x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalAlpha = 1;
    }

    function drawPlayer(camX) {
      const px = player.x - camX;
      const py = player.y;

      if (player.spinCharging && player.spinCharge > 0) {
        const bx = px - 20;
        const by = py - 22;
        const bw = 66;
        const bh = 8;
        const p = player.spinCharge / 14;

        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(bx, by, bw, bh);

        ctx.fillStyle = p > 0.75 ? "#ff5252" : p > 0.4 ? "#ffd54f" : "#69f0ae";
        ctx.fillRect(bx + 1, by + 1, (bw - 2) * p, bh - 2);
      }

      ctx.save();

      if (player.invuln > 0 && Math.floor(player.invuln * 12) % 2 === 0) {
        ctx.globalAlpha = 0.45;
      }

      const cx = px + player.w / 2;
      const cy = py + player.h / 2;

      const spinMode =
        player.dashTime > 0 ||
        player.spinDashTimer > 0 ||
        player.rolling ||
        !player.onGround ||
        player.loop ||
        player.rail;

      if (spinMode) {
        ctx.translate(cx, cy);
        ctx.rotate(player.spinAngle * player.facing);

        ctx.fillStyle = "#1d5df0";
        ctx.beginPath();
        ctx.arc(0, 0, 17, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#8fd3ff";
        ctx.lineWidth = 3;

        for (let i = 0; i < 3; i++) {
          ctx.beginPath();
          ctx.arc(
            0,
            0,
            11,
            i * 2.1 + player.spinAngle,
            i * 2.1 + player.spinAngle + 1.1
          );
          ctx.stroke();
        }

        ctx.fillStyle = "#ffd9a0";
        ctx.beginPath();
        ctx.arc(6, 4, 5, 0, Math.PI * 2);
        ctx.fill();
      } else {
        ctx.translate(cx, cy);
        ctx.scale(player.facing, 1);

        ctx.fillStyle = "#1d5df0";

        ctx.beginPath();
        ctx.moveTo(-6, -8);
        ctx.lineTo(-23, -15);
        ctx.lineTo(-9, -1);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(-4, -16);
        ctx.lineTo(-20, -27);
        ctx.lineTo(-4, -6);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.ellipse(0, 2, 13, 16, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffd9a0";
        ctx.beginPath();
        ctx.ellipse(3, 6, 7, 9, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.ellipse(7, -7, 6, 7, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#111";
        ctx.beginPath();
        ctx.arc(9, -7, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#e53935";
        ctx.fillRect(-8, 12, 13, 7);
        ctx.fillRect(1, 14, 13, 7);
      }

      ctx.restore();
    }

    function drawHUD() {
      ctx.fillStyle = "rgba(0,0,0,0.28)";
      ctx.fillRect(12, 12, 250, 120);

      ctx.fillStyle = "rgba(255,255,255,0.08)";
      ctx.fillRect(12, 12, 250, 4);

      ctx.textAlign = "left";
      ctx.font = "bold 22px Arial";

      ctx.fillStyle = "white";
      ctx.fillText(`SCORE ${score}`, 26, 40);

      ctx.fillStyle = rings === 0 ? "#ff6b6b" : "#ffd54f";
      ctx.fillText(`RINGE ${rings}`, 26, 68);

      ctx.fillStyle = "white";
      ctx.fillText(`ZEIT ${time.toFixed(1)}`, 26, 96);
      ctx.fillText(`LEBEN ${lives}`, 26, 124);

      if (level && level.boss && level.boss.health > 0) {
        const b = level.boss;
        const bw = 320;

        ctx.fillStyle = "rgba(0,0,0,0.4)";
        ctx.fillRect(W / 2 - bw / 2, 16, bw, 24);

        ctx.fillStyle = "#ff5252";
        ctx.fillRect(
          W / 2 - bw / 2 + 3,
          19,
          (bw - 6) * (b.health / b.maxHealth),
          18
        );

        ctx.strokeStyle = "white";
        ctx.lineWidth = 2;
        ctx.strokeRect(W / 2 - bw / 2, 16, bw, 24);

        ctx.fillStyle = "white";
        ctx.font = "bold 16px Arial";
        ctx.textAlign = "center";
        ctx.fillText("BOSS", W / 2, 34);
      }
    }

    function drawCenterText(text, y, size = 48, color = "#ffffff") {
      ctx.fillStyle = color;
      ctx.font = `bold ${size}px Arial`;
      ctx.textAlign = "center";
      ctx.fillText(text, W / 2, y);
    }

    function drawOverlays() {
      ctx.textAlign = "center";

      if (gameState === "play" && levelMessage > 0 && level) {
        ctx.globalAlpha = Math.min(1, levelMessage);
        drawCenterText(level.name, 120, 52, "#ffffff");
        ctx.globalAlpha = 1;
      }

      if (gameState === "title") {
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(0, 0, W, H);

        drawCenterText("SPEED DASH MOBILE", 140, 64);
        drawCenterText("Easy + Polish Prototype", 190, 28);

        ctx.font = "22px Arial";
        ctx.fillStyle = "#ffffff";

        ctx.fillText("Touch-Buttons oder Tastatur", W / 2, 270);
        ctx.fillText("Unten + Space tippen = Spin-Dash | Unten loslassen = Start", W / 2, 305);
        ctx.fillText("M = Ton an/aus | Checkpoints & Herzen machen es leichter", W / 2, 340);

        drawCenterText("TIPPE / DRÜCKE ENTER ODER SPACE", 450, 32, "#7CFC90");
      }

      if (gameState === "levelIntro" && level) {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(0, 0, W, H);

        drawCenterText(`LEVEL ${currentLevel + 1}`, 190, 36, "#9ccc65");
        drawCenterText(level.name, 260, 64);
        drawCenterText(`Leben: ${lives}`, 330, 28);
        drawCenterText("TIPPE / DRÜCKE ENTER ODER SPACE", 420, 30, "#7CFC90");
      }

      if (gameState === "dead") {
        ctx.fillStyle = "rgba(0,0,0,0.55)";
        ctx.fillRect(0, 0, W, H);

        drawCenterText("DU WURDEST GETROFFEN", 220, 52, "#ff6b6b");
        drawCenterText(`Leben übrig: ${lives}`, 300, 30);
        drawCenterText("TIPPE / ENTER für Neustart", 380, 28, "#7CFC90");
      }

      if (gameState === "levelClear") {
        ctx.fillStyle = "rgba(0,0,0,0.45)";
        ctx.fillRect(0, 0, W, H);

        drawCenterText("LEVEL GESCHAFFT!", 210, 64, "#ffd54f");
        drawCenterText(`Score: ${score}`, 290, 32);
        drawCenterText(`Zeit: ${time.toFixed(1)}s`, 335, 32);
        drawCenterText("TIPPE / ENTER für das nächste Level", 420, 28, "#7CFC90");
      }

      if (gameState === "gameover") {
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(0, 0, W, H);

        drawCenterText("GAME OVER", 230, 72, "#ff5252");
        drawCenterText(`Score: ${score}`, 310, 32);
        drawCenterText("TIPPE / ENTER für Titelbildschirm", 400, 28, "#7CFC90");
      }

      if (gameState === "win") {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(0, 0, W, H);

        drawCenterText("BOSS BESIEGT!", 200, 68, "#ffd54f");
        drawCenterText("Du hast den Prototype durchgespielt!", 270, 30);
        drawCenterText(`Score: ${score}`, 330, 34);
        drawCenterText("TIPPE / ENTER für Titelbildschirm", 420, 28, "#7CFC90");
      }
    }

    function render() {
      const camX = level
        ? Math.max(0, Math.min(level.width - W, player.x + player.w / 2 - W / 2))
        : 0;

      drawBackground(camX);

      if (level) {
        drawWorld(camX);
        drawTrail(camX);
        drawPlayer(camX);
        drawParticles(camX);
      }

      if (gameState !== "title") {
        drawHUD();
      }

      drawOverlays();
    }

    /* ---------------- GAME LOOP ---------------- */

    let last = performance.now();
    let accumulator = 0;

    function loop(now) {
      let dt = (now - last) / 1000;
      last = now;

      if (dt > 0.1) dt = 0.1;

      animT += dt;
      accumulator += dt;

      while (accumulator >= STEP) {
        fixedUpdate();
        accumulator -= STEP;
      }

      render();
      requestAnimationFrame(loop);
    }

    loadLevel(0);
    gameState = "title";
    requestAnimationFrame(loop);
  </script>
</body>
