<!-- PUSH PACK 3 -->
<script>
  if (!window.__sdPushPack3) {
    window.__sdPushPack3 = true;

    let lastComboTier = 0;

    /* ---------------- FIXED UPDATE PUSH ---------------- */

    const oldFixedUpdate = fixedUpdate;

    fixedUpdate = function () {
      oldFixedUpdate();

      if (gameState === "play") {
        // Combo milestones
        const tier = Math.floor(combo / 5);

        if (tier > lastComboTier && combo >= 5) {
          addPopup(
            player.x + player.w / 2,
            player.y - 44,
            `COMBO x${combo}`,
            "#ffeb3b"
          );

          flash = Math.max(flash, 0.03);
          shake = Math.max(shake, 0.05);
        }

        lastComboTier = tier;

        // Boss phase 2
        if (level.boss && level.boss.health === 1 && !level.boss.phase2) {
          level.boss.phase2 = true;

          addPopup(
            level.boss.x + level.boss.w / 2,
            level.boss.y - 24,
            "BOSS PHASE 2",
            "#ff5252"
          );

          flash = Math.max(flash, 0.12);
          shake = Math.max(shake, 0.20);

          spawnParticles(
            level.boss.x + level.boss.w / 2,
            level.boss.y + level.boss.h / 2,
            "#ff5252",
            30,
            7
          );
        }
      } else {
        lastComboTier = 0;
      }
    };

    window.fixedUpdate = fixedUpdate;

    /* ---------------- AUTO BOOST SHOCKWAVE ---------------- */

    const oldTriggerAutoBoost = triggerAutoBoost;

    triggerAutoBoost = function () {
      oldTriggerAutoBoost();

      flash = Math.max(flash, 0.05);
      shake = Math.max(shake, 0.12);

      spawnParticles(
        player.x + player.w / 2,
        player.y + player.h / 2,
        "#80d8ff",
        26,
        7
      );

      spawnParticles(
        player.x + player.w / 2,
        player.y + player.h,
        "#ffffff",
        12,
        4
      );
    };

    window.triggerAutoBoost = triggerAutoBoost;

    /* ---------------- DYNAMIC SPEED COLOR ---------------- */

    const oldDrawBackground = drawBackground;

    drawBackground = function (camX) {
      oldDrawBackground(camX);

      if (gameState === "play") {
        const speed = Math.abs(player.vx);
        const intensity = Math.min(
          0.10,
          speed * 0.003 + flowHeat * 0.05
        );

        if (intensity > 0.02) {
          ctx.save();
          ctx.globalCompositeOperation = "lighter";

          const hue = (animT * 50 + player.x * 0.01) % 360;

          ctx.fillStyle = `hsla(${hue}, 90%, 60%, ${intensity * 0.25})`;
          ctx.fillRect(0, 0, VIEW_W, H);

          ctx.restore();
        }
      }
    };

    window.drawBackground = drawBackground;

    /* ---------------- AFTERBURN FLAMES ---------------- */

    const oldDrawPlayer = drawPlayer;

    drawPlayer = function (camX) {
      oldDrawPlayer(camX);

      if (
        gameState === "play" &&
        (player.autoBoost > 0 || Math.abs(player.vx) > 15)
      ) {
        const px = player.x - camX + player.w / 2;
        const py = player.y + player.h / 2;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        for (let i = 0; i < 5; i++) {
          const off = i * 8 + Math.sin(animT * 30 + i) * 2;
          const x = px - player.facing * (22 + off);
          const y = py + 4 + Math.sin(animT * 25 + i * 2) * 3;
          const r = 6 - i;

          if (r <= 0) continue;

          const g = ctx.createRadialGradient(x, y, 0, x, y, r * 2);
          g.addColorStop(0, "rgba(255,180,80,0.25)");
          g.addColorStop(1, "rgba(255,80,0,0)");

          ctx.fillStyle = g;

          ctx.beginPath();
          ctx.arc(x, y, r * 2, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();
      }
    };

    window.drawPlayer = drawPlayer;

    /* ---------------- BOSS PHASE 2 GLOW ---------------- */

    const oldDrawBoss = drawBoss;

    drawBoss = function (camX) {
      oldDrawBoss(camX);

      if (
        level &&
        level.boss &&
        level.boss.phase2 &&
        level.boss.health > 0
      ) {
        const x = level.boss.x - camX + level.boss.w / 2;
        const y = level.boss.y + level.boss.h / 2;

        ctx.save();
        ctx.globalCompositeOperation = "lighter";

        const pulse = 0.10 + 0.05 * Math.sin(animT * 8);

        const g = ctx.createRadialGradient(x, y, 10, x, y, 90);
        g.addColorStop(0, `rgba(255,60,60,${pulse})`);
        g.addColorStop(1, "rgba(255,0,0,0)");

        ctx.fillStyle = g;

        ctx.beginPath();
        ctx.arc(x, y, 90, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }
    };

    window.drawBoss = drawBoss;

    /* ---------------- CHECKPOINT GLOW PULSE ---------------- */

    const oldDrawCheckpoint = drawCheckpoint;

    drawCheckpoint = function (c, camX) {
      oldDrawCheckpoint(c, camX);

      if (c.active) {
        const x = c.x - camX;

        if (x > -60 && x < VIEW_W + 60) {
          ctx.save();
          ctx.globalCompositeOperation = "lighter";

          const a = 0.05 + 0.03 * Math.sin(animT * 5 + c.x * 0.01);

          ctx.fillStyle = `rgba(105,240,174,${a})`;
          ctx.fillRect(x - 6, c.y - 200, 34, 200);

          ctx.restore();
        }
      }
    };

    window.drawCheckpoint = drawCheckpoint;

    /* ---------------- FLOW MUSIC SPARKLES ---------------- */

    setInterval(() => {
      if (
        audioCtx &&
        !muted &&
        gameState === "play" &&
        flowHeat > 0.85 &&
        Math.random() < 0.25
      ) {
        const note = 96 + Math.floor(Math.random() * 7);

        playSynth(
          note,
          0.05,
          "sine",
          0.015,
          0,
          0,
          musicGain
        );
      }
    }, 220);
  }
</script>
