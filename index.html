<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Speed Dash FLOW</title>
  <style>
    :root {
      --ctrl-opacity: 0.72;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #02040d;
      overflow: hidden;
      touch-action: none;
      font-family: Arial, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      display: block;
      image-rendering: pixelated;
    }

    #fsBtn,
    #ctrlVisBtn {
      position: fixed;
      z-index: 45;
      width: 52px;
      height: 52px;
      border-radius: 16px;
      border: 2px solid rgba(255, 255, 255, 0.13);
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.40);
      font-size: 24px;
      opacity: 0.58;
    }

    #fsBtn {
      top: calc(10px + env(safe-area-inset-top));
      right: calc(12px + env(safe-area-inset-right));
    }

    #ctrlVisBtn {
      top: calc(10px + env(safe-area-inset-top));
      left: calc(12px + env(safe-area-inset-left));
      display: none;
    }

    #fsBtn:active,
    #ctrlVisBtn:active {
      opacity: 0.95;
      background: rgba(255, 255, 255, 0.13);
    }

    @media (pointer: coarse) {
      #ctrlVisBtn {
        display: block;
      }
    }

    #controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: calc(6px + env(safe-area-inset-bottom));
      display: none;
      justify-content: space-between;
      padding: 0 14px;
      z-index: 30;
      pointer-events: none;
    }

    .group {
      display: flex;
      gap: clamp(8px, 1.5vw, 14px);
      pointer-events: auto;
    }

    .ctrl {
      width: clamp(58px, 12vw, 88px);
      height: clamp(58px, 12vw, 88px);
      border-radius: 20px;
      border: 2px solid rgba(255, 255, 255, 0.20);
      background: rgba(255, 255, 255, 0.10);
      color: rgba(255, 255, 255, 0.70);
      font-size: clamp(22px, 4.6vw, 30px);
      font-weight: bold;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      backdrop-filter: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.14);
      opacity: var(--ctrl-opacity);
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.30);
    }

    .ctrl.smallText {
      font-size: clamp(13px, 2.4vw, 18px);
    }

    .ctrl.wide {
      width: clamp(110px, 22vw, 160px);
    }

    .ctrl:active {
      opacity: calc(var(--ctrl-opacity) + 0.22);
      background: rgba(255, 255, 255, 0.18);
    }

    #controls.show {
      display: flex;
    }

    @media (pointer: coarse) {
      #controls {
        display: flex;
      }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <button id="fsBtn" title="Fullscreen">⛶</button>
  <button id="ctrlVisBtn" title="Button-Sichtbarkeit">◐</button>

  <div id="controls">
    <div class="group">
      <button class="ctrl" data-key="ArrowLeft">◀</button>
      <button class="ctrl" data-key="ArrowRight">▶</button>
    </div>

    <div class="group">
      <button class="ctrl smallText wide" data-key="Space">JUMP</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const H = 540;
    let VIEW_W = 960;

    const isTouch =
      ("ontouchstart" in window) ||
      navigator.maxTouchPoints > 0 ||
      window.matchMedia("(pointer: coarse)").matches;

    const MOBILE_LIFT = isTouch ? 78 : 0;

    function resize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const aspect = window.innerWidth / Math.max(1, window.innerHeight);

      VIEW_W = Math.round(H * aspect);
      VIEW_W = Math.max(320, Math.min(2400, VIEW_W));

      canvas.width = Math.round(VIEW_W * dpr);
      canvas.height = Math.round(H * dpr);

      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    window.addEventListener("resize", resize);
    resize();

    if (isTouch) {
      document.getElementById("controls").classList.add("show");
    }

    /* ---------------- FULLSCREEN / BUTTON VISIBILITY ---------------- */

    const fsBtn = document.getElementById("fsBtn");
    const ctrlVisBtn = document.getElementById("ctrlVisBtn");

    function goFullscreen() {
      const el = document.documentElement;

      if (el.requestFullscreen) {
        el.requestFullscreen().catch(() => {});
      } else if (el.webkitRequestFullscreen) {
        el.webkitRequestFullscreen();
      }
    }

    let fsAutoDone = false;

    function tryAutoFullscreen() {
      if (fsAutoDone) return;
      fsAutoDone = true;
      goFullscreen();
    }

    window.addEventListener("pointerdown", tryAutoFullscreen, { once: true });
    window.addEventListener("keydown", tryAutoFullscreen, { once: true });

    fsBtn.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
    });

    fsBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      goFullscreen();
    });

    const ctrlVisValues = [0.72, 0.42, 0.95];
    let ctrlVisIndex = 0;

    ctrlVisBtn.addEventListener("pointerdown", (e) => {
      e.stopPropagation();
    });

    ctrlVisBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      ctrlVisIndex = (ctrlVisIndex + 1) % ctrlVisValues.length;
      document.documentElement.style.setProperty(
        "--ctrl-opacity",
        ctrlVisValues[ctrlVisIndex]
      );
    });

    /* ---------------- GAME STATE ---------------- */

    const STEP = 1 / 60;
    const LEVEL_COUNT = 4;

    const START_LIVES = 8;
    const START_RINGS = 5;
    const BOSS_HEALTH = 3;
    const ENEMY_SPEED = 0.9;
    const GRAVITY = 0.64;
    const JUMP_POWER = -15.8;
    const DOUBLE_JUMP_POWER = -14.0;
    const ACCEL = 0.82;
    const AIR_ACCEL = 0.46;
    const MAX_BASE = 12.4;
    const INVULN_TIME = 3.5;
    const BOSS_BULLET_SPEED = 3.2;
    const DOUBLE_JUMP = true;

    let gameState = "title";
    let currentLevel = 0;
    let score = 0;
    let rings = START_RINGS;
    let lives = START_LIVES;
    let time = 0;
    let levelMessage = 0;
    let animT = 0;
    let checkpoint = null;

    const particles = [];
    const popups = [];

    let shake = 0;
    let combo = 0;
    let comboTimer = 0;
    let flash = 0;
    let hitStop = 0;

    let boostMeter = 0;

    let flowHeat = 0;
    let flowMaxed = false;

    const keys = {};
    let jumpPressed = false;

    const player = {
      x: 80,
      y: 320,
      w: 26,
      h: 34,
      vx: 0,
      vy: 0,
      onGround: false,
      facing: 1,
      rolling: false,

      autoBoost: 0,

      invuln: 0,
      spinAngle: 0,
      jumping: false,
      doubleUsed: false,

      loop: null,
      rail: null,

      shield: false,

      squash: 0,

      trail: []
    };

    let level = null;

    const themes = [
      {
        skyTop: "#5ec8ff",
        skyMid: "#aeeaff",
        skyBottom: "#f2ffff",
        hill1: "#7fdb8f",
        hill2: "#4fc46a",
        ambient: "rgba(180,255,190,"
      },
      {
        skyTop: "#ff8f5e",
        skyMid: "#ffc792",
        skyBottom: "#fff0d0",
        hill1: "#d97b6c",
        hill2: "#a34d5e",
        ambient: "rgba(255,210,160,"
      },
      {
        skyTop: "#101128",
        skyMid: "#34194d",
        skyBottom: "#582364",
        hill1: "#3d1f56",
        hill2: "#2a103c",
        ambient: "rgba(200,170,255,"
      },
      {
        skyTop: "#0b0f3a",
        skyMid: "#1d1a63",
        skyBottom: "#5e2ca5",
        hill1: "#392b7a",
        hill2: "#1c1450",
        ambient: "rgba(0,255,255,"
      }
    ];

    const groundThemes = [
      { dirt: "#7b4a21", grass: "#49d651", light: "#a2ff9e" },
      { dirt: "#6d4c41", grass: "#ffb74d", light: "#ffe0b2" },
      { dirt: "#37474f", grass: "#b0bec5", light: "#eceff1" },
      { dirt: "#141034", grass: "#00e5ff", light: "#b2fff9" }
    ];

    /* ---------------- AUDIO ---------------- */

    let audioCtx = null;
    let masterGain = null;
    let musicGain = null;
    let sfxGain = null;
    let delayNode = null;
    let musicFilter = null;
    let musicTimer = null;
    let musicStep = 0;
    let muted = false;
    let noiseBuffer = null;

    const musicPatterns = [
      {
        bpm: 150,
        bass: [36, 36, 43, 36, 41, 36, 43, 45],
        lead: [72, 76, 79, 76, 74, 76, 79, 81, 79, 76, 74, 76, 72, 74, 76, 79],
        chords: [
          [60, 64, 67],
          [57, 60, 64],
          [55, 59, 62],
          [57, 60, 64]
        ]
      },
      {
        bpm: 132,
        bass: [33, 33, 40, 33, 38, 33, 40, 41],
        lead: [69, 72, 76, 72, 74, 72, 76, 77, 76, 74, 72, 74, 69, 71, 72, 76],
        chords: [
          [57, 60, 64],
          [55, 59, 62],
          [53, 57, 60],
          [55, 59, 62]
        ]
      },
      {
        bpm: 162,
        bass: [28, 28, 35, 28, 33, 28, 35, 36],
        lead: [64, 67, 71, 67, 65, 67, 71, 72, 71, 67, 65, 67, 64, 65, 67, 71],
        chords: [
          [52, 55, 59],
          [50, 53, 57],
          [48, 52, 55],
          [50, 53, 57]
        ]
      }
    ];

    function initAudio() {
      if (audioCtx) {
        if (audioCtx.state === "suspended") audioCtx.resume();
        return;
      }

      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;

      audioCtx = new AC();

      masterGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : 0.5;

      const compressor = audioCtx.createDynamicsCompressor();
      masterGain.connect(compressor);
      compressor.connect(audioCtx.destination);

      musicGain = audioCtx.createGain();
      musicGain.gain.value = 0.18;

      sfxGain = audioCtx.createGain();
      sfxGain.gain.value = 0.35;
      sfxGain.connect(masterGain);

      delayNode = audioCtx.createDelay(1.0);
      delayNode.delayTime.value = 0.18;

      const feedback = audioCtx.createGain();
      feedback.gain.value = 0.24;

      delayNode.connect(feedback);
      feedback.connect(delayNode);
      delayNode.connect(masterGain);

      musicFilter = audioCtx.createBiquadFilter();
      musicFilter.type = "lowpass";
      musicFilter.frequency.value = 6500;

      musicGain.connect(musicFilter);
      musicFilter.connect(masterGain);
      musicFilter.connect(delayNode);
    }

    function toggleMute() {
      muted = !muted;
      if (masterGain) masterGain.gain.value = muted ? 0 : 0.5;
    }

    function midiToFreq(m) {
      return 440 * Math.pow(2, (m - 69) / 12);
    }

    function getNoiseBuffer() {
      if (!audioCtx) return null;
      if (noiseBuffer) return noiseBuffer;

      const len = audioCtx.sampleRate * 0.2;
      noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
      const data = noiseBuffer.getChannelData(0);

      for (let i = 0; i < len; i++) {
        data[i] = Math.random() * 2 - 1;
      }

      return noiseBuffer;
    }

    function playSynth(midi, dur = 0.1, type = "square", gain = 0.2, slide = 0, when = 0, dest = null) {
      if (!audioCtx || muted) return;

      const t = audioCtx.currentTime + when;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();

      o.type = type;
      o.frequency.setValueAtTime(midiToFreq(midi), t);

      if (slide !== 0) {
        o.frequency.exponentialRampToValueAtTime(
          Math.max(20, midiToFreq(midi + slide)),
          t + dur
        );
      }

      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);

      o.connect(g);
      g.connect(dest || sfxGain);

      o.start(t);
      o.stop(t + dur + 0.03);
    }

    function playMusicNote(midi, dur, type, gain) {
      playSynth(midi, dur, type, gain, 0, 0, musicGain);
    }

    function playNoise(dur = 0.05, gain = 0.1, filterType = "highpass", when = 0, dest = null) {
      if (!audioCtx || muted) return;

      const buffer = getNoiseBuffer();
      if (!buffer) return;

      const src = audioCtx.createBufferSource();
      src.buffer = buffer;

      const filter = audioCtx.createBiquadFilter();
      filter.type = filterType;
      filter.frequency.value = filterType === "bandpass" ? 1800 : 6500;

      const g = audioCtx.createGain();
      const t = audioCtx.currentTime + when;

      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);

      src.connect(filter);
      filter.connect(g);
      g.connect(dest || musicGain);

      src.start(t);
      src.stop(t + dur + 0.02);
    }

    function playKick(when = 0, dest = null) {
      if (!audioCtx || muted) return;

      const t = audioCtx.currentTime + when;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();

      o.type = "sine";
      o.frequency.setValueAtTime(130, t);
      o.frequency.exponentialRampToValueAtTime(34, t + 0.12);

      g.gain.setValueAtTime(0.5, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);

      o.connect(g);
      g.connect(dest || musicGain);

      o.start(t);
      o.stop(t + 0.17);
    }

    function startMusic(levelIndex) {
      if (!audioCtx) return;

      stopMusic();

      const p = musicPatterns[levelIndex] || musicPatterns[0];
      musicStep = 0;

      const stepDur = 60 / p.bpm / 2;
      const ms = stepDur * 1000;

      musicTimer = setInterval(() => {
        if (muted || gameState !== "play") return;

        const idx = musicStep % 16;
        const bar = Math.floor(musicStep / 16) % p.chords.length;
        const chord = p.chords[bar];

        if (idx % 2 === 0) {
          playMusicNote(
            p.bass[Math.floor(idx / 2) % p.bass.length],
            stepDur * 0.9,
            "triangle",
            0.24
          );
        } else {
          playMusicNote(
            p.bass[Math.floor((idx - 1) / 2) % p.bass.length] + 12,
            stepDur * 0.32,
            "triangle",
            0.05
          );
        }

        if (idx === 0 || idx === 8) {
          playMusicNote(
            p.bass[Math.floor(idx / 2) % p.bass.length] - 12,
            stepDur * 1.4,
            "sine",
            0.12
          );
        }

        playMusicNote(
          p.lead[idx % p.lead.length],
          stepDur * 0.7,
          "square",
          0.06
        );

        if (idx % 4 === 0) {
          playMusicNote(
            p.lead[idx % p.lead.length] - 12,
            stepDur * 1.2,
            "triangle",
            0.03
          );
        }

        if (idx === 0 || idx === 8) {
          for (const n of chord) {
            playMusicNote(n, stepDur * 3.6, "triangle", 0.045);
          }
        }

        if (idx === 4 || idx === 12) {
          for (const n of chord) {
            playMusicNote(n + 12, stepDur * 0.4, "sine", 0.03);
          }
        }

        const arpNote = chord[(musicStep + idx) % chord.length] + 12;
        playMusicNote(arpNote, stepDur * 0.22, "square", 0.022);

        if (idx % 4 === 0) {
          playKick(0, musicGain);
        }

        if (idx === 4 || idx === 12) {
          playNoise(0.09, 0.06, "bandpass", 0, musicGain);
        }

        if (idx % 2 === 0) {
          playNoise(0.03, 0.025, "highpass", 0, musicGain);
        } else {
          playNoise(0.02, 0.012, "highpass", 0, musicGain);
        }

        if (idx === 2 || idx === 10) {
          playNoise(0.05, 0.02, "highpass", 0, musicGain);
        }

        if (idx === 6 || idx === 14) {
          playNoise(0.07, 0.03, "highpass", 0, musicGain);
        }

        musicStep++;
      }, ms);
    }

    function stopMusic() {
      if (musicTimer) {
        clearInterval(musicTimer);
        musicTimer = null;
      }
    }

    function sfxJump() {
      playSynth(72, 0.13, "square", 0.18, 12);
    }

    function sfxDoubleJump() {
      playSynth(78, 0.12, "square", 0.16, 16);
    }

    function sfxRing() {
      playSynth(91, 0.06, "sine", 0.16);
      playSynth(98, 0.08, "sine", 0.14, 0, 0.05);
    }

    function sfxBoost() {
      playSynth(55, 0.18, "sawtooth", 0.2, 28);
    }

    function sfxAutoBoost() {
      playSynth(48, 0.22, "sawtooth", 0.22, 24);
      playSynth(72, 0.12, "square", 0.12, 10, 0.03);
    }

    function sfxFlowMax() {
      playSynth(76, 0.14, "square", 0.16, 8);
      playSynth(83, 0.16, "square", 0.14, 6, 0.06);
    }

    function sfxHurt() {
      playSynth(50, 0.25, "sawtooth", 0.24, -20);
    }

    function sfxSpring() {

    }

    function sfxEnemy() {

    function sfxBossHit() {

      playSynth(62, 0.12, "sawtooth", 0.16, 12, 0.03);
    }

    function sfxShoot() {
      playSynth(76, 0.08, "square", 0.1, -10);
    }

    function sfxCheckpoint() {
      [72, 79, 84].forEach((n, i) => {
        playSynth(n, 0.12, "square", 0.14, 0, i * 0.06);
      });
    }

    function sfxHeart() {
      [76, 83, 88].forEach((n, i) => {
        playSynth(n, 0.12, "sine", 0.16, 0, i * 0.06);
      });
    }

    function sfxShield() {
      [74, 86, 93].forEach((n, i) => {
        playSynth(n, 0.12, "sine", 0.18, 0, i * 0.06);

    }

    function sfxLevelClear() {
      [72, 76, 79, 84].forEach((n, i) => {
        playSynth(n, 0.16, "square", 0.16, 0, i * 0.09);
      });
    }

    function sfxWin() {
      [60, 64, 67, 72, 76, 79, 84].forEach((n, i) => {
        playSynth(n, 0.18, "square", 0.16, 0, i * 0.08);
      });
    }

    /* ---------------- LEVELS ---------------- */

    function makeLevel1() {
      const platforms = [
        { x: 0, y: 480, w: 5200, h: 60 },
        { x: 700, y: 360, w: 240, h: 24 },
        { x: 1700, y: 350, w: 240, h: 24 },

      ];

      const loops = [

      const boosters = [
        { x: 700, y: 456, w: 90, h: 24, dir: 1, power: 18 },
        { x: 3300, y: 456, w: 90, h: 24, dir: 1, power: 19 },
        { x: 4100, y: 456, w: 90, h: 24, dir: 1, power: 18 }
      ];

      const springs = [
        { x: 2340, y: 456, w: 52, h: 24 },

      ];

      const spikes = [
        { x: 3050, y: 456, w: 70, h: 24 },

      ];

      const enemies = [
        { x: 1800, y: 446, w: 34, h: 34, dir: 1, minX: 1700, maxX: 2200, dead: false },
        { x: 2700, y: 446, w: 34, h: 34, dir: -1, minX: 2600, maxX: 2900, dead: false },
        { x: 4300, y: 446, w: 34, h: 34, dir: 1, minX: 3800, maxX: 4450, dead: false }
      ];

      const checkpoints = [
        { x: 1500, y: 380, w: 26, h: 100, active: false },
        { x: 3000, y: 380, w: 26, h: 100, active: false },
        { x: 4500, y: 380, w: 26, h: 100, active: false }
      ];

      const hearts = [
        { x: 1700, y: 300, taken: false },
        { x: 2900, y: 310, taken: false },
        { x: 4300, y: 310, taken: false }
      ];

      const shields = [
        { x: 2500, y: 330, taken: false },
        { x: 4700, y: 330, taken: false }

      const rings = [];
      const add = (x, y, n = 1, dx = 38) => {
        for (let i = 0; i < n; i++) {
          rings.push({ x: x + i * dx, y, taken: false });
        }
      };

      add(250, 430, 8);
      add(720, 320, 5);
      add(1000, 430, 7);
      add(1250, 360, 6);
      add(1700, 300, 5);
      add(2100, 430, 7);
      add(2600, 430, 7);
      add(2800, 300, 5);
      add(3200, 430, 7);
      add(3800, 430, 7);
      add(4200, 300, 5);
      add(4700, 430, 7);

      return {
        name: "GREEN DASH",
        width: 5200,
        playerStart: { x: 80, y: 320 },
        platforms,
        spikes,
        springs,
        boosters,
        rails: [],
        loops,
        rings,
        enemies,
        checkpoints,
        hearts,
        shields,
        goal: { x: 5050, y: 360, w: 40, h: 120 },
        boss: null,
        bullets: []
      };
    }

    function makeLevel2() {
      const platforms = [
        { x: 0, y: 480, w: 6200, h: 60 },
        { x: 350, y: 360, w: 240, h: 24 },
        { x: 2300, y: 360, w: 240, h: 24 },
        { x: 4000, y: 360, w: 240, h: 24 },
        { x: 5600, y: 350, w: 240, h: 24 }
      ];

      const rails = [
        { x: 1200, y: 380, w: 800, h: 14, dir: 1, speed: 17 },
        { x: 2800, y: 350, w: 900, h: 14, dir: 1, speed: 18 },
        { x: 4500, y: 380, w: 800, h: 14, dir: 1, speed: 19 }
      ];

    function shiftLevelForMobile(lvl, dy) {
      lvl.playerStart.y += dy;

      if (lvl.platforms) {
        lvl.platforms.forEach((p) => {
          p.y += dy;
        });
      }

      if (lvl.spikes) {
        lvl.spikes.forEach((s) => {
          s.y += dy;
        });
      }

      if (lvl.springs) {
        lvl.springs.forEach((s) => {
          s.y += dy;
        });
      }

      if (lvl.boosters) {
        lvl.boosters.forEach((b) => {
          b.y += dy;
        });
      }

      if (lvl.rails) {
        lvl.rails.forEach((r) => {
          r.y += dy;
        });
      }

      if (lvl.loops) {
        lvl.loops.forEach((l) => {
          l.cy += dy;
        });
      }

      if (lvl.rings) {
        lvl.rings.forEach((r) => {
          r.y += dy;
        });
      }

      if (lvl.enemies) {
        lvl.enemies.forEach((e) => {
          e.y += dy;
        });
      }

      if (lvl.checkpoints) {
        lvl.checkpoints.forEach((c) => {
          c.y += dy;
        });
      }

      if (lvl.hearts) {
        lvl.hearts.forEach((h) => {
          h.y += dy;
        });
      }

      if (lvl.shields) {
        lvl.shields.forEach((s) => {
          s.y += dy;
        });
      }

      if (lvl.goal) {
        lvl.goal.y += dy;
      }

      if (lvl.boss) {
        lvl.boss.y += dy;
        lvl.boss.baseY += dy;
      }

      let lvl;

      if (index === 0) lvl = makeLevel1();
      else if (index === 1) lvl = makeLevel2();
      else if (index === 2) lvl = makeLevel3();
      else lvl = makeLevel4();

      if (isTouch && MOBILE_LIFT !== 0) {
        shiftLevelForMobile(lvl, -MOBILE_LIFT);
      }

      return lvl;
    }

    function loadLevel(index) {
      level = buildLevel(index);
      currentLevel = index;

        startX = checkpoint.x;
