<!-- PUSH ADDON: sichtbarere Mobile-Buttons + Grafik/BGM Push -->
<style>
  :root {
    --ctrl-opacity: 0.75;
  }

  #ctrlVisBtn {
    position: fixed;
    top: calc(10px + env(safe-area-inset-top));
    left: calc(12px + env(safe-area-inset-left));
    z-index: 45;
    width: 56px;
    height: 56px;
    border-radius: 18px;
    border: 2px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.07);
    color: rgba(255, 255, 255, 0.45);
    font-size: 26px;
    opacity: 0.65;
    display: none;
  }

  #ctrlVisBtn:active {
    opacity: 0.95;
    background: rgba(255, 255, 255, 0.14);
  }

  @media (pointer: coarse) {
    #ctrlVisBtn {
      display: block;
    }
  }

  .ctrl {
    opacity: var(--ctrl-opacity) !important;
    background: rgba(255, 255, 255, 0.12) !important;
    border: 3px solid rgba(255, 255, 255, 0.24) !important;
    color: rgba(255, 255, 255, 0.72) !important;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.18);
  }

  .ctrl:active {
    opacity: calc(var(--ctrl-opacity) + 0.22) !important;
    background: rgba(255, 255, 255, 0.20) !important;
  }
</style>

<script>
  const ctrlVisBtn = document.createElement("button");
  ctrlVisBtn.id = "ctrlVisBtn";
  ctrlVisBtn.textContent = "◐";
  ctrlVisBtn.title = "Button-Sichtbarkeit";
  document.body.appendChild(ctrlVisBtn);

  const ctrlVisValues = [0.75, 0.45, 0.95];
  let ctrlVisIndex = 0;

  ctrlVisBtn.addEventListener("pointerdown", (e) => {
    e.stopPropagation();
  });

  ctrlVisBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    ctrlVisIndex = (ctrlVisIndex + 1) % ctrlVisValues.length;
    document.documentElement.style.setProperty(
      "--ctrl-opacity",
      ctrlVisValues[ctrlVisIndex]
    );
  });

  /* ---------------- GRAFIK PUSH ---------------- */

  function drawLightLeaks(camX) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";

    const colors = [
      "rgba(255,255,190,",
      "rgba(180,235,255,",
      "rgba(255,180,255,"
    ];

    const base = colors[currentLevel] || colors[0];

    for (let i = 0; i < 6; i++) {
      const x = mod(
        i * 340 + Math.sin(animT * 0.3 + i) * 80 - camX * 0.18,
        VIEW_W + 400
      ) - 200;

      const y = 70 + (i * 67) % 260;
      const r = 90 + (i % 3) * 45;
      const a = 0.035 + 0.02 * Math.sin(animT + i);

      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, base + Math.max(0.015, a) + ")");
      g.addColorStop(1, "rgba(255,255,255,0)");

      ctx.fillStyle = g;
      ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }

    ctx.restore();
  }

  function drawTrail(camX) {
    if (!player.trail.length) return;

    ctx.save();
    ctx.globalCompositeOperation = "lighter";

    for (const t of player.trail) {
      const x = t.x - camX;
      const p = Math.max(0, t.life / 0.22);
      const a = p * 0.22;

      ctx.fillStyle = `rgba(90,180,255,${a})`;
      ctx.beginPath();
      ctx.arc(x, t.y, 12 * p + 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `rgba(255,255,255,${a * 0.35})`;
      ctx.beginPath();
      ctx.arc(x, t.y, 6 * p + 2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawRing(x, y) {
    if (x < -60 || x > VIEW_W + 60) return;

    const pulse = Math.sin(animT * 6 + x * 0.02) * 1.5;

    ctx.save();

    ctx.shadowColor = "rgba(255,190,0,0.5)";
    ctx.shadowBlur = 16;

    ctx.strokeStyle = "rgba(255,179,0,0.35)";
    ctx.lineWidth = 11;
    ctx.beginPath();
    ctx.arc(x, y, 16 + pulse, 0, Math.PI * 2);
    ctx.stroke();

    ctx.shadowBlur = 0;

    ctx.strokeStyle = "#ffb300";
    ctx.lineWidth = 7;
    ctx.beginPath();
    ctx.arc(x, y, 14 + pulse, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = "#fff176";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(x, y, 10 + pulse * 0.5, 0, Math.PI * 2);
    ctx.stroke();

    const spark = Math.sin(animT * 8 + x * 0.05);

    if (spark > 0.86) {
      ctx.fillStyle = "rgba(255,255,255,0.85)";
      ctx.beginPath();
      ctx.arc(x + 8, y - 8, 2, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function render() {
    let camX = 0;

    if (level) {
      const lookahead = player.vx * 10;

      camX = player.x + player.w / 2 + lookahead - VIEW_W / 2;

      if (level.width >= VIEW_W) {
        camX = Math.max(0, Math.min(level.width - VIEW_W, camX));
      } else {
        camX = (level.width - VIEW_W) / 2;
      }
    }

    drawBackground(camX);
    drawAmbient(camX);
    drawLightLeaks(camX);

    ctx.save();

    if (shake > 0) {
      const s = shake * 16;

      ctx.translate(
        (Math.random() - 0.5) * s,
        (Math.random() - 0.5) * s
      );
    }

    if (level) {
      drawWorld(camX);
      drawShadow(camX);
      drawTrail(camX);
      drawSpeedLines(camX);
      drawPlayer(camX);
      drawParticles(camX);
      drawForeground(camX);
    }

    ctx.restore();

    drawVignette();
    drawFlash();

    if (gameState !== "title") {
      drawHUD();
    }

    if (combo > 1 && gameState === "play") {
      drawCenterText(
        `${combo}x COMBO`,
        170,
        Math.min(34, VIEW_W / 18),
        "#ffeb3b"
      );

      const bw = Math.min(240, VIEW_W * 0.28);
      const p = Math.max(0, comboTimer / 2);

      ctx.fillStyle = "rgba(0,0,0,0.25)";
      roundRect(VIEW_W / 2 - bw / 2, 182, bw, 8, 4);
      ctx.fill();

      ctx.fillStyle = "#ffeb3b";
      roundRect(VIEW_W / 2 - bw / 2, 182, bw * p, 8, 4);
      ctx.fill();
    }

    if (level && level.boss && level.boss.vulnerable && gameState === "play") {
      drawCenterText(
        "JETZT!",
        228,
        Math.min(30, VIEW_W / 22),
        "#ffeb3b"
      );
    }

    drawOverlays();
  }

  /* ---------------- AUDIO PUSH ---------------- */

  function initAudio() {
    if (audioCtx) {
      if (audioCtx.state === "suspended") audioCtx.resume();
      return;
    }

    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;

    audioCtx = new AC();

    masterGain = audioCtx.createGain();
    masterGain.gain.value = muted ? 0 : 0.5;

    const compressor = audioCtx.createDynamicsCompressor();
    masterGain.connect(compressor);
    compressor.connect(audioCtx.destination);

    musicGain = audioCtx.createGain();
    musicGain.gain.value = 0.18;

    sfxGain = audioCtx.createGain();
    sfxGain.gain.value = 0.35;
    sfxGain.connect(masterGain);

    delayNode = audioCtx.createDelay(1.0);
    delayNode.delayTime.value = 0.18;

    const feedback = audioCtx.createGain();
    feedback.gain.value = 0.24;

    delayNode.connect(feedback);
    feedback.connect(delayNode);
    delayNode.connect(masterGain);

    const musicFilter = audioCtx.createBiquadFilter();
    musicFilter.type = "lowpass";
    musicFilter.frequency.value = 7500;

    musicGain.connect(musicFilter);
    musicFilter.connect(masterGain);
    musicFilter.connect(delayNode);
  }

  function startMusic(levelIndex) {
    if (!audioCtx) return;

    stopMusic();

    const p = musicPatterns[levelIndex] || musicPatterns[0];
    musicStep = 0;

    const stepDur = 60 / p.bpm / 2;
    const ms = stepDur * 1000;

    musicTimer = setInterval(() => {
      if (muted || gameState !== "play") return;

      const idx = musicStep % 16;
      const bar = Math.floor(musicStep / 16) % p.chords.length;
      const chord = p.chords[bar];

      if (idx % 2 === 0) {
        playMusicNote(
          p.bass[Math.floor(idx / 2) % p.bass.length],
          stepDur * 0.9,
          "triangle",
          0.24
        );
      } else {
        playMusicNote(
          p.bass[Math.floor((idx - 1) / 2) % p.bass.length] + 12,
          stepDur * 0.32,
          "triangle",
          0.05
        );
      }

      if (idx === 0 || idx === 8) {
        playMusicNote(
          p.bass[Math.floor(idx / 2) % p.bass.length] - 12,
          stepDur * 1.4,
          "sine",
          0.12
        );
      }

      playMusicNote(
        p.lead[idx % p.lead.length],
        stepDur * 0.7,
        "square",
        0.06
      );

      if (idx % 4 === 0) {
        playMusicNote(
          p.lead[idx % p.lead.length] - 12,
          stepDur * 1.2,
          "triangle",
          0.03
        );
      }

      if (idx === 0 || idx === 8) {
        for (const n of chord) {
          playMusicNote(n, stepDur * 3.6, "triangle", 0.045);
        }
      }

      if (idx === 4 || idx === 12) {
        for (const n of chord) {
          playMusicNote(n + 12, stepDur * 0.4, "sine", 0.03);
        }
      }

      const arpNote = chord[(musicStep + idx) % chord.length] + 12;
      playMusicNote(arpNote, stepDur * 0.22, "square", 0.022);

      if (idx % 4 === 0) {
        playKick(0, musicGain);
      }

      if (idx === 4 || idx === 12) {
        playNoise(0.09, 0.06, "bandpass", 0, musicGain);
      }

      if (idx % 2 === 0) {
        playNoise(0.03, 0.025, "highpass", 0, musicGain);
      } else {
        playNoise(0.02, 0.012, "highpass", 0, musicGain);
      }

      if (idx === 2 || idx === 10) {
        playNoise(0.05, 0.02, "highpass", 0, musicGain);
      }

      if (idx === 6 || idx === 14) {
        playNoise(0.07, 0.03, "highpass", 0, musicGain);
      }

      musicStep++;
    }, ms);
  }
</script>
